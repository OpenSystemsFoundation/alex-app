<template>
    <div class="cfd-container">
        <!-- Settings Bar -->
        <div class="cfd-settings">
            <div class="cfd-settings__left">
                <label class="cfd-label">Time Range:</label>
                <select class="cfd-select" onchange={handleDaysChange} value={daysBack}>
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30">30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                </select>
            </div>
            <div class="cfd-settings__right">
                <label class="cfd-checkbox-label">
                    <input type="checkbox" checked={showStacked} onchange={handleStackedToggle} />
                    Stacked
                </label>
                <label class="cfd-checkbox-label">
                    <input type="checkbox" checked={showGrid} onchange={handleGridToggle} />
                    Grid
                </label>
            </div>
        </div>

        <!-- Canvas -->
        <div class="cfd-canvas-wrapper">
            <canvas class="cfd-canvas" onmousemove={handleMouseMove} onmouseleave={handleMouseLeave}></canvas>

            <!-- Tooltip -->
            <template lwc:if={showTooltip}>
                <div class="cfd-tooltip" style={tooltipStyle}>
                    <div class="cfd-tooltip__date">{tooltipDate}</div>
                    <template for:each={tooltipItems} for:item="item">
                        <div key={item.name} class="cfd-tooltip__item">
                            <span class="cfd-tooltip__color" style={item.colorStyle}></span>
                            <span class="cfd-tooltip__name">{item.name}</span>
                            <span class="cfd-tooltip__value">{item.value}</span>
                        </div>
                    </template>
                    <div class="cfd-tooltip__total">Total: {tooltipTotal}</div>
                </div>
            </template>
        </div>

        <!-- Legend -->
        <div class="cfd-legend">
            <template for:each={legendItems} for:item="item">
                <div key={item.name} class="cfd-legend__item">
                    <span class="cfd-legend__color" style={item.colorStyle}></span>
                    <span class="cfd-legend__label">{item.name}</span>
                </div>
            </template>
        </div>
    </div>
</template>
