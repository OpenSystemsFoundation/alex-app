<template>
    <section
        class={modalClass}
        role="dialog"
        aria-labelledby="modal-heading"
        aria-modal="true"
    >
        <div class="slds-modal__container">
            <!-- Modal Header -->
            <div class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={handleClose}
                    aria-label="Close"
                >
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="close"
                        size="small"
                    ></lightning-icon>
                    <span class="slds-assistive-text"
                        >Close</span
                    >
                </button>
                <h1
                    id="modal-heading"
                    class="slds-modal__title slds-hyphenate"
                >
                    <lightning-icon
                        icon-name="standard:task"
                        size="small"
                        class="slds-m-right_x-small"
                    ></lightning-icon>
                    <span class="slds-text-color_brand"
                        >{card.Name}</span
                    >
                </h1>
            </div>

            <!-- Modal Body -->
            <div
                class="slds-modal__content slds-p-around_medium"
                id="modal-content"
            >
                <lightning-record-edit-form
                    object-api-name="OpenSF__Card__c"
                    record-id={card.Id}
                    onsuccess={handleSuccess}
                    onerror={handleError}
                >
                    <!-- Form Fields Container -->
                    <div
                        class="slds-form slds-form_stacked"
                    >
                        <div
                            class="slds-grid slds-wrap slds-gutters_small"
                        >
                            <!-- Dynamic Fields from Custom Metadata -->
                            <template
                                for:each={regularFields}
                                for:item="field"
                            >
                                <div
                                    key={field.key}
                                    class={field.columnClass}
                                >
                                    <lightning-input-field
                                        field-name={field.fieldName}
                                        variant="label-stacked"
                                    >
                                    </lightning-input-field>
                                </div>
                            </template>

                            <!-- Description Field - Always at bottom -->
                            <template
                                lwc:if={descriptionField}
                            >
                                <div
                                    class="slds-col slds-size_1-of-1 slds-m-top_small"
                                >
                                    <lightning-input-field
                                        field-name={descriptionField.fieldName}
                                        variant="label-stacked"
                                    >
                                    </lightning-input-field>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </div>

            <!-- Modal Footer -->
            <div class="slds-modal__footer">
                <div
                    class="slds-grid slds-grid_align-spread"
                >
                    <div>
                        <lightning-button
                            variant="destructive-text"
                            label="Delete"
                            onclick={handleDelete}
                            icon-name="utility:delete"
                        >
                        </lightning-button>
                    </div>
                    <div>
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleClose}
                            class="slds-m-right_x-small"
                        >
                        </lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Save"
                            onclick={handleSave}
                            icon-name="utility:save"
                        >
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class={backdropClass}></div>
</template>
