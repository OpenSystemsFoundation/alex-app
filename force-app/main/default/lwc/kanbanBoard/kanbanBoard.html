<template>
    <div class="kanban-board-wrapper">
        <!-- Unified Top Bar: tabs + sprint info + actions in one row -->
        <template lwc:if={isInternalMode}>
            <div class="kanban-topbar">
                <!-- Left: Tab Switches -->
                <div class="kanban-topbar__tabs">
                    <button
                        class={backlogTabButtonClass}
                        data-tab-id="backlog"
                        onclick={handleTabClick}
                    >
                        Backlog
                        <span class="tab-badge"
                            >{backlogCardCount}</span
                        >
                    </button>
                    <button
                        class={boardTabButtonClass}
                        data-tab-id="board"
                        onclick={handleTabClick}
                    >
                        Board
                    </button>
                    <button
                        class={columnsTabButtonClass}
                        data-tab-id="columns"
                        onclick={handleTabClick}
                    >
                        Columns
                    </button>
                    <button
                        class={analyticsTabButtonClass}
                        onclick={handleAnalyticsTabClick}
                    >
                        Analytics
                    </button>
                </div>

                <!-- Center: Sprint Info (compact inline) -->
                <template lwc:if={isSprintBoard}>
                    <c-kanban-sprint-header
                        store={store}
                        oncompletesprint={handleCompleteSprint}
                        onshowreports={handleShowReports}
                    ></c-kanban-sprint-header>
                </template>

                <!-- Right: Status + Actions -->
                <div class="kanban-topbar__actions">
                    <template lwc:if={showUndoRedoButtons}>
                        <div class="topbar-undo-redo">
                            <button
                                class={undoButtonClass}
                                title={undoTooltip}
                                onclick={handleUndo}
                                disabled={isUndoDisabled}
                            >
                                <lightning-icon
                                    icon-name="utility:undo"
                                    size="xx-small"
                                    alternative-text="Undo"
                                ></lightning-icon>
                            </button>
                            <button
                                class={redoButtonClass}
                                title={redoTooltip}
                                onclick={handleRedo}
                                disabled={isRedoDisabled}
                            >
                                <lightning-icon
                                    icon-name="utility:redo"
                                    size="xx-small"
                                    alternative-text="Redo"
                                ></lightning-icon>
                            </button>
                        </div>
                    </template>
                    <c-connection-status-indicator
                        config={connectionStatusConfig}
                    ></c-connection-status-indicator>
                    <button
                        class={refreshButtonClass}
                        title="Refresh"
                        onclick={handleRefresh}
                    >
                        <lightning-icon
                            icon-name="utility:refresh"
                            size="xx-small"
                            alternative-text="Refresh"
                        ></lightning-icon>
                    </button>
                </div>
            </div>
        </template>

        <!-- Error State -->
        <template lwc:if={error}>
            <div
                class="kanban__error slds-text-color_error slds-is-relative slds-align_absolute-center slds-var-p-vertical_x-small"
            >
                <lightning-formatted-text
                    value={error}
                ></lightning-formatted-text>
            </div>
        </template>

        <!-- Experience Cloud: Read-only sprint info bar -->
        <template lwc:if={experienceCloud}>
            <template lwc:if={isSprintBoard}>
                <div class="kanban-topbar">
                    <c-kanban-sprint-header
                        store={store}
                        experience-cloud={experienceCloud}
                    ></c-kanban-sprint-header>
                </div>
            </template>
        </template>

        <!-- Board Tab Content (always show in Experience Cloud since there are no tabs) -->
        <template lwc:if={showBoardContent}>
            <div class="kanban-board-container slds-grid">
                <div class="kanban-board-main">
                    <template lwc:if={isInternalMode}>
                        <c-kanban-filter-bar
                            search-value={_boardSearchTerm}
                            search-placeholder="Search cards..."
                            show-priority-filter
                            priority-value={_boardFilterPriority}
                            priority-options={priorityFilterOptions}
                            show-card-type-filter
                            card-type-value={_boardFilterCardType}
                            card-type-options={cardTypeFilterOptions}
                            show-epic-filter={hasEpics}
                            epic-value={_boardFilterEpic}
                            epic-options={epicFilterOptions}
                            show-assignee-filter={hasAssigneeFilterOptions}
                            assignee-value={_boardFilterAssignees}
                            assignee-options={assigneeFilterOptions}
                            show-swimlane-filter
                            swimlane-value={_swimlaneMode}
                            swimlane-options={swimlaneModeOptions}
                            show-hide-done-toggle={showHideDoneToggle}
                            hide-done-active={_boardHideCompleted}
                            show-info-text={hasActiveFilters}
                            info-text={filterSummary}
                            show-clear-filters={hasActiveFilters}
                            onsearchinput={handleBoardSearch}
                            onprioritychange={handlePriorityFilter}
                            oncardtypechange={handleCardTypeFilter}
                            onepicchange={handleEpicFilter}
                            onassigneechange={handleAssigneeFilter}
                            onswimlanechange={handleSwimlaneChange}
                            ontogglehidedone={handleToggleHideCompleted}
                            onclearfilters={handleClearFilters}
                        ></c-kanban-filter-bar>
                    </template>

                    <!-- No Active Sprint Empty State (sprint board only) -->
                    <template lwc:if={hasNoActiveSprint}>
                        <div class="kanban-no-sprint-state">
                            <lightning-icon
                                icon-name="utility:sprint"
                                size="large"
                                class="kanban-no-sprint-state__icon"
                            ></lightning-icon>
                            <h2
                                class="kanban-no-sprint-state__title"
                            >
                                No Active Sprint
                            </h2>
                            <p
                                class="kanban-no-sprint-state__body"
                            >
                                Start a sprint from the
                                Backlog tab to see cards
                                here.
                            </p>
                            <lightning-button
                                label="Go to Backlog"
                                variant="brand"
                                icon-name="utility:list"
                                onclick={handleGoToBacklog}
                            ></lightning-button>
                        </div>
                    </template>
                    <template lwc:else>
                        <!-- Mobile Column Selector -->
                        <div class="mobile-column-selector">
                            <button
                                class="mobile-nav-btn"
                                onclick={handleMobilePrevColumn}
                                disabled={isMobileFirstColumn}
                            >
                                <lightning-icon
                                    icon-name="utility:chevronleft"
                                    size="xx-small"
                                    alternative-text="Previous"
                                ></lightning-icon>
                            </button>
                            <select
                                class="mobile-column-select"
                                onchange={handleMobileColumnChange}
                                value={mobileActiveColumnId}
                            >
                                <template
                                    for:each={filteredColumns}
                                    for:item="col"
                                >
                                    <option
                                        key={col.Id}
                                        value={col.Id}
                                    >
                                        {col.columnHeader}
                                        ({col.cardCount})
                                    </option>
                                </template>
                            </select>
                            <button
                                class="mobile-nav-btn"
                                onclick={handleMobileNextColumn}
                                disabled={isMobileLastColumn}
                            >
                                <lightning-icon
                                    icon-name="utility:chevronright"
                                    size="xx-small"
                                    alternative-text="Next"
                                ></lightning-icon>
                            </button>
                            <span
                                class="mobile-column-counter"
                                >{mobileColumnCounter}</span
                            >
                        </div>

                        <!-- Kanban Board (swimlane mode) -->
                        <template lwc:if={hasSwimlanes}>
                            <div
                                class="kanban-board kanban-board--swimlanes slds-scrollable_x"
                            >
                                <!-- Column Headers Row -->
                                <div
                                    class="swimlane-header-row"
                                >
                                    <div
                                        class="swimlane-label-cell"
                                    ></div>
                                    <template
                                        for:each={filteredColumns}
                                        for:item="column"
                                    >
                                        <div
                                            key={column.Id}
                                            class="swimlane-col-header"
                                            style={column.columnStyle}
                                        >
                                            <span
                                                class="slds-truncate"
                                                >{column.columnHeader}</span
                                            >
                                            <template
                                                lwc:if={column.hasWipLimit}
                                            >
                                                <span
                                                    class="wip-badge"
                                                    >{column.cardCount}/{column.wipLimit}</span
                                                >
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <!-- Swimlane Rows -->
                                <template
                                    for:each={swimlanes}
                                    for:item="lane"
                                >
                                    <div
                                        key={lane.key}
                                        class="swimlane-row"
                                    >
                                        <div
                                            class="swimlane-label-cell"
                                        >
                                            <span
                                                class="swimlane-label"
                                                >{lane.label}</span
                                            >
                                            <span
                                                class="swimlane-count"
                                                >{lane.totalCards}</span
                                            >
                                        </div>
                                        <template
                                            for:each={lane.columns}
                                            for:item="col"
                                        >
                                            <div
                                                key={col.laneKey}
                                                class="swimlane-cell"
                                                data-column-id={col.Id}
                                                ondragover={handleDragOver}
                                                ondrop={handleDrop}
                                            >
                                                <template
                                                    for:each={col.cards}
                                                    for:item="card"
                                                >
                                                    <article
                                                        key={card.Id}
                                                        class="kanban-card"
                                                        data-card-id={card.Id}
                                                        data-column-id={col.Id}
                                                        draggable="true"
                                                        ondragstart={handleDragStart}
                                                        ondragend={handleDragEnd}
                                                        onclick={handleCardClick}
                                                        oncontextmenu={handleBoardCardContextMenu}
                                                        style={card.cardStyle}
                                                    >
                                                        <div
                                                            class="kanban-card__body slds-text-body_small"
                                                        >
                                                            <p
                                                                class={card.subjectClass}
                                                                title={card.subjectTitle}
                                                            >
                                                                {card.subject}
                                                            </p>
                                                            <template
                                                                lwc:if={card.hasStoryPoints}
                                                            >
                                                                <span
                                                                    class="swimlane-card-sp"
                                                                    >{card.storyPoints}</span
                                                                >
                                                            </template>
                                                        </div>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Kanban Board (normal mode, no swimlanes) -->
                        <template lwc:else>
                            <div
                                class="kanban-board slds-grid slds-scrollable_x"
                                ontouchstart={handleTouchStart}
                                ontouchend={handleTouchEnd}
                            >
                                <template
                                    lwc:if={hasColumns}
                                >
                                    <template
                                        for:each={filteredColumns}
                                        for:item="column"
                                    >
                                        <!-- Kanban Column -->
                                        <div
                                            key={column.Id}
                                            class={column.mobileColumnClass}
                                            data-column-id={column.Id}
                                            style={column.columnStyle}
                                        >
                                            <!-- Column Header -->
                                            <div
                                                class="kanban-column__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                                            >
                                                <div
                                                    class="slds-col slds-truncate"
                                                >
                                                    <h2
                                                        class="slds-text-heading_small slds-truncate"
                                                    >
                                                        <template
                                                            lwc:if={experienceCloud}
                                                        >
                                                            <a
                                                                href={column.communityColumnUrl}
                                                                class="slds-text-link slds-text-color_brand slds-truncate"
                                                                title={column.columnHeader}
                                                            >
                                                                <span
                                                                    class="slds-truncate"
                                                                    >{column.columnHeader}</span
                                                                >
                                                            </a>
                                                        </template>
                                                        <template
                                                            lwc:else
                                                        >
                                                            <a
                                                                href={column.columnUrl}
                                                                class="slds-text-link slds-text-color_brand slds-truncate"
                                                                title={column.columnHeader}
                                                                onclick={handleColumnClick}
                                                                data-column-id={column.Id}
                                                            >
                                                                <span
                                                                    class="slds-truncate"
                                                                    >{column.columnHeader}</span
                                                                >
                                                            </a>
                                                        </template>
                                                    </h2>
                                                </div>

                                                <!-- WIP Limit Badge -->
                                                <template
                                                    lwc:if={column.hasWipLimit}
                                                >
                                                    <span
                                                        class={column.wipBadgeClass}
                                                        >{column.cardCount}/{column.wipLimit}</span
                                                    >
                                                </template>

                                                <!-- Add Card Button (internal only) -->
                                                <template
                                                    lwc:if={isInternalMode}
                                                >
                                                    <div
                                                        class="add-button-wrapper"
                                                    >
                                                        <button
                                                            class="add-card-button slds-button slds-button_icon slds-button_icon-border-filled"
                                                            data-column-id={column.Id}
                                                            onclick={handleAddCard}
                                                            title="Add New Card"
                                                        >
                                                            <lightning-icon
                                                                icon-name="utility:add"
                                                                alternative-text="Add New Card"
                                                                size="small"
                                                            ></lightning-icon>
                                                            <span
                                                                class="slds-assistive-text"
                                                                >Add
                                                                New
                                                                Card</span
                                                            >
                                                        </button>
                                                    </div>
                                                </template>
                                            </div>

                                            <!-- Scrollable Card Wrapper (internal: drag-drop enabled) -->
                                            <template
                                                lwc:if={isInternalMode}
                                            >
                                                <div
                                                    class="kanban-column__card-wrapper slds-scrollable_y"
                                                    data-column-id={column.Id}
                                                    ondragover={handleDragOver}
                                                    ondrop={handleDrop}
                                                >
                                                    <template
                                                        lwc:if={column.cards.length}
                                                    >
                                                        <template
                                                            for:each={column.cards}
                                                            for:item="card"
                                                        >
                                                            <article
                                                                key={card.Id}
                                                                class="kanban-card"
                                                                data-card-id={card.Id}
                                                                data-column-id={column.Id}
                                                                draggable="true"
                                                                ondragstart={handleDragStart}
                                                                ondragend={handleDragEnd}
                                                                onclick={handleCardClick}
                                                                oncontextmenu={handleBoardCardContextMenu}
                                                                style={card.cardStyle}
                                                            >
                                                                <!-- Card Header -->
                                                                <header
                                                                    class="slds-media slds-media_center slds-has-flexi-truncate slds-var-p-bottom_xx-small"
                                                                >
                                                                    <template
                                                                        lwc:if={card.hasAssignee}
                                                                    >
                                                                        <!-- Assignee Avatar -->
                                                                        <div
                                                                            class="slds-media__figure"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.assignee.photoUrl}
                                                                            >
                                                                                <span
                                                                                    class="slds-avatar slds-avatar_circle"
                                                                                >
                                                                                    <img
                                                                                        src={card.assignee.photoUrl}
                                                                                        alt={card.assignee.name}
                                                                                        title={card.assignee.name}
                                                                                    />
                                                                                </span>
                                                                            </template>
                                                                            <template
                                                                                lwc:else
                                                                            >
                                                                                <span
                                                                                    class="slds-avatar slds-avatar_circle slds-avatar_medium slds-avatar_small@mobile"
                                                                                >
                                                                                    <span
                                                                                        class="slds-avatar__initials"
                                                                                    >
                                                                                        {card.assigneeInitials}
                                                                                    </span>
                                                                                </span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <!-- Card Title -->
                                                                    <div
                                                                        class="slds-media__body kanban-card__header-body"
                                                                    >
                                                                        <h2
                                                                            class="slds-card__header-title slds-text-body_small kanban-card__name-heading"
                                                                        >
                                                                            <a
                                                                                href={card.recordUrl}
                                                                                class={card.nameClass}
                                                                                title={card.nameTitle}
                                                                                onclick={handleCardNameClick}
                                                                                data-card-id={card.Id}
                                                                            >
                                                                                {card.Name}
                                                                            </a>
                                                                        </h2>

                                                                        <p
                                                                            class="slds-text-body_small slds-truncate card-type-line"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.cardTypeIconName}
                                                                            >
                                                                                <lightning-icon
                                                                                    icon-name={card.cardTypeIconName}
                                                                                    size="xx-small"
                                                                                    class="card-type-icon"
                                                                                ></lightning-icon>
                                                                            </template>
                                                                            <template
                                                                                lwc:if={card.cardType}
                                                                            >
                                                                                <span
                                                                                    >{card.cardType}</span
                                                                                >
                                                                                <template
                                                                                    lwc:if={card.status}
                                                                                >
                                                                                    <span
                                                                                        >&nbsp;-&nbsp;</span
                                                                                    >
                                                                                </template>
                                                                            </template>
                                                                            <template
                                                                                lwc:if={card.status}
                                                                            >
                                                                                <span>
                                                                                    {card.status}
                                                                                </span>
                                                                            </template>
                                                                        </p>
                                                                    </div>
                                                                </header>

                                                                <!-- Card Body -->
                                                                <div
                                                                    class="kanban-card__body slds-text-body_regular slds-var-p-top_small"
                                                                >
                                                                    <template
                                                                        lwc:if={card.subject}
                                                                    >
                                                                        <p
                                                                            class={card.subjectClass}
                                                                            title={card.subjectTitle}
                                                                        >
                                                                            {card.subject}
                                                                        </p>
                                                                    </template>

                                                                    <!-- Epic Label (for child cards belonging to an epic) -->
                                                                    <template
                                                                        lwc:if={card.hasEpic}
                                                                    >
                                                                        <div
                                                                            class={card.epicLabelContainerClass}
                                                                        >
                                                                            <lightning-icon
                                                                                icon-name="utility:layers"
                                                                                size="xx-small"
                                                                                class="epic-label__icon"
                                                                            ></lightning-icon>
                                                                            <span
                                                                                class={card.epicLabelClass}
                                                                                title={card.epicLabelTitle}
                                                                                >{card.epicLabel}</span
                                                                            >
                                                                        </div>
                                                                    </template>

                                                                    <!-- Custom Fields -->
                                                                    <template
                                                                        lwc:if={card.hasCustomFields}
                                                                    >
                                                                        <div
                                                                            class="kanban-card__custom-fields"
                                                                        >
                                                                            <template
                                                                                for:each={card.customFieldEntries}
                                                                                for:item="cf"
                                                                            >
                                                                                <span
                                                                                    key={cf.key}
                                                                                    class="custom-field-pill"
                                                                                    title={cf.label}
                                                                                >
                                                                                    <span
                                                                                        class="custom-field-label"
                                                                                        >{cf.label}:</span
                                                                                    >
                                                                                    {cf.value}
                                                                                </span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <!-- Card Icons -->
                                                                    <div
                                                                        class="kanban-card__body-icons slds-grid slds-wrap slds-grid_align-spread"
                                                                    >
                                                                        <!-- Left side: Priority and Due Date -->
                                                                        <div
                                                                            class="slds-grid slds-grid_vertical-align-center"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.priority}
                                                                            >
                                                                                <div
                                                                                    class="slds-var-p-right_small"
                                                                                >
                                                                                    <span
                                                                                        class="slds-badge priority-pill slds-var-p-vertical_xxx-small slds-var-p-horizontal_small"
                                                                                    >
                                                                                        <span
                                                                                            class={card.priorityClass}
                                                                                        >
                                                                                            {card.priority}
                                                                                        </span>
                                                                                    </span>
                                                                                </div>
                                                                            </template>

                                                                            <template
                                                                                lwc:if={card.formattedDueDate}
                                                                            >
                                                                                <div>
                                                                                    <span
                                                                                        class="slds-badge due-date-pill slds-var-p-vertical_xxx-small slds-var-p-horizontal_small"
                                                                                    >
                                                                                        <lightning-icon
                                                                                            icon-name="utility:clock"
                                                                                            size="xx-small"
                                                                                            class="date-icon"
                                                                                        ></lightning-icon>
                                                                                        <span
                                                                                            class={card.isOverdue}
                                                                                        >
                                                                                            {card.formattedDueDate}
                                                                                        </span>
                                                                                    </span>
                                                                                </div>
                                                                            </template>
                                                                        </div>

                                                                        <!-- Right side: Story Points -->
                                                                        <template
                                                                            lwc:if={card.hasStoryPoints}
                                                                        >
                                                                            <div
                                                                                class="slds-text-body_small slds-text-color_weak"
                                                                            >
                                                                                <span
                                                                                    class="slds-text-title slds-text-heading_small"
                                                                                    ><strong
                                                                                        >{card.storyPoints}</strong
                                                                                    ></span
                                                                                >
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </div>

                                                                <!-- Debug: LexoRank -->
                                                                <template
                                                                    lwc:if={showDebugInfo}
                                                                >
                                                                    <div
                                                                        class="debug-lexorank"
                                                                    >
                                                                        <template
                                                                            lwc:if={card.position}
                                                                        >
                                                                            {card.position}
                                                                        </template>
                                                                        <template
                                                                            lwc:else
                                                                        >
                                                                            <em
                                                                                >null</em
                                                                            >
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </article>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Scrollable Card Wrapper (Experience Cloud: read-only, no drag-drop) -->
                                            <template
                                                lwc:else
                                            >
                                                <div
                                                    class="kanban-column__card-wrapper slds-scrollable_y"
                                                >
                                                    <template
                                                        lwc:if={column.cards.length}
                                                    >
                                                        <template
                                                            for:each={column.cards}
                                                            for:item="card"
                                                        >
                                                            <article
                                                                key={card.Id}
                                                                class="kanban-card"
                                                                style={card.cardStyle}
                                                            >
                                                                <!-- Card Header -->
                                                                <header
                                                                    class="slds-media slds-media_center slds-has-flexi-truncate slds-var-p-bottom_xx-small"
                                                                >
                                                                    <template
                                                                        lwc:if={card.hasAssignee}
                                                                    >
                                                                        <div
                                                                            class="slds-media__figure"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.assignee.photoUrl}
                                                                            >
                                                                                <span
                                                                                    class="slds-avatar slds-avatar_circle"
                                                                                >
                                                                                    <img
                                                                                        src={card.assignee.photoUrl}
                                                                                        alt={card.assignee.name}
                                                                                        title={card.assignee.name}
                                                                                    />
                                                                                </span>
                                                                            </template>
                                                                            <template
                                                                                lwc:else
                                                                            >
                                                                                <span
                                                                                    class="slds-avatar slds-avatar_circle slds-avatar_medium slds-avatar_small@mobile"
                                                                                >
                                                                                    <span
                                                                                        class="slds-avatar__initials"
                                                                                    >
                                                                                        {card.assigneeInitials}
                                                                                    </span>
                                                                                </span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <!-- Card Title (community URL) -->
                                                                    <div
                                                                        class="slds-media__body kanban-card__header-body"
                                                                    >
                                                                        <h2
                                                                            class="slds-card__header-title slds-text-body_small kanban-card__name-heading"
                                                                        >
                                                                            <a
                                                                                href={card.communityCardUrl}
                                                                                class={card.nameClass}
                                                                                title={card.nameTitle}
                                                                            >
                                                                                {card.Name}
                                                                            </a>
                                                                        </h2>

                                                                        <p
                                                                            class="slds-text-body_small slds-truncate card-type-line"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.cardTypeIconName}
                                                                            >
                                                                                <lightning-icon
                                                                                    icon-name={card.cardTypeIconName}
                                                                                    size="xx-small"
                                                                                    class="card-type-icon"
                                                                                ></lightning-icon>
                                                                            </template>
                                                                            <template
                                                                                lwc:if={card.cardType}
                                                                            >
                                                                                <span
                                                                                    >{card.cardType}</span
                                                                                >
                                                                                <template
                                                                                    lwc:if={card.status}
                                                                                >
                                                                                    <span
                                                                                        >&nbsp;-&nbsp;</span
                                                                                    >
                                                                                </template>
                                                                            </template>
                                                                            <template
                                                                                lwc:if={card.status}
                                                                            >
                                                                                <span>
                                                                                    {card.status}
                                                                                </span>
                                                                            </template>
                                                                        </p>
                                                                    </div>
                                                                </header>

                                                                <!-- Card Body -->
                                                                <div
                                                                    class="kanban-card__body slds-text-body_regular slds-var-p-top_small"
                                                                >
                                                                    <template
                                                                        lwc:if={card.subject}
                                                                    >
                                                                        <p
                                                                            class={card.subjectClass}
                                                                            title={card.subjectTitle}
                                                                        >
                                                                            {card.subject}
                                                                        </p>
                                                                    </template>

                                                                    <!-- Epic Label (community) -->
                                                                    <template
                                                                        lwc:if={card.hasEpic}
                                                                    >
                                                                        <div
                                                                            class={card.epicLabelContainerClass}
                                                                        >
                                                                            <lightning-icon
                                                                                icon-name="utility:layers"
                                                                                size="xx-small"
                                                                                class="epic-label__icon"
                                                                            ></lightning-icon>
                                                                            <span
                                                                                class={card.epicLabelClass}
                                                                                title={card.epicLabelTitle}
                                                                                >{card.epicLabel}</span
                                                                            >
                                                                        </div>
                                                                    </template>

                                                                    <!-- Card Icons -->
                                                                    <div
                                                                        class="kanban-card__body-icons slds-grid slds-wrap slds-grid_align-spread"
                                                                    >
                                                                        <div
                                                                            class="slds-grid slds-grid_vertical-align-center"
                                                                        >
                                                                            <template
                                                                                lwc:if={card.priority}
                                                                            >
                                                                                <div
                                                                                    class="slds-var-p-right_small"
                                                                                >
                                                                                    <span
                                                                                        class="slds-badge priority-pill slds-var-p-vertical_xxx-small slds-var-p-horizontal_small"
                                                                                    >
                                                                                        <span
                                                                                            class={card.priorityClass}
                                                                                        >
                                                                                            {card.priority}
                                                                                        </span>
                                                                                    </span>
                                                                                </div>
                                                                            </template>

                                                                            <template
                                                                                lwc:if={card.formattedDueDate}
                                                                            >
                                                                                <div>
                                                                                    <span
                                                                                        class="slds-badge due-date-pill slds-var-p-vertical_xxx-small slds-var-p-horizontal_small"
                                                                                    >
                                                                                        <lightning-icon
                                                                                            icon-name="utility:clock"
                                                                                            size="xx-small"
                                                                                            class="date-icon"
                                                                                        ></lightning-icon>
                                                                                        <span
                                                                                            class={card.isOverdue}
                                                                                        >
                                                                                            {card.formattedDueDate}
                                                                                        </span>
                                                                                    </span>
                                                                                </div>
                                                                            </template>
                                                                        </div>

                                                                        <template
                                                                            lwc:if={card.hasStoryPoints}
                                                                        >
                                                                            <div
                                                                                class="slds-text-body_small slds-text-color_weak"
                                                                            >
                                                                                <span
                                                                                    class="slds-text-title slds-text-heading_small"
                                                                                    ><strong
                                                                                        >{card.storyPoints}</strong
                                                                                    ></span
                                                                                >
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </article>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </template>

                                <!-- Empty Board State -->
                                <template lwc:else>
                                    <div
                                        class="slds-text-align_center slds-var-m-top_medium slds-var-p-around_medium"
                                    >
                                        <p
                                            class="slds-text-body_regular"
                                        >
                                            No columns
                                            found. Please
                                            add columns to
                                            this board!
                                        </p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Card Detail Panel (Board tab, internal only) -->
                <template lwc:if={isInternalMode}>
                    <template lwc:if={showCardDetail}>
                        <c-kanban-card-panel
                            card={selectedCard}
                            store={store}
                            is-open={showCardDetail}
                            initial-panel-width={_cardPanelWidth}
                            onclose={handleCardDetailClose}
                            oncardupdated={handleCardUpdated}
                            oncarddeleted={handleCardDeleted}
                            onpanelresize={handleCardPanelResize}
                            onnavigatetocard={handlePanelNavigateToCard}
                        ></c-kanban-card-panel>
                    </template>

                    <!-- Board Context Menu -->
                    <c-kanban-context-menu
                        menu-items={boardContextMenuItems}
                        onselect={handleBoardContextMenuSelect}
                    ></c-kanban-context-menu>
                </template>
            </div>
        </template>

        <!-- Backlog Tab Content (internal only) -->
        <template lwc:if={showBacklogContent}>
            <div class="kanban-backlog-container slds-grid">
                <c-kanban-backlog-view
                    store={store}
                    show-debug-info={showDebugInfo}
                    oncardclick={handleBacklogCardClick}
                    onnavigatetocard={handleBacklogNavigateToCard}
                    onerror={handleBacklogError}
                    onstartsprint={handleBacklogStartSprint}
                    oncompletesprint={handleCompleteSprint}
                ></c-kanban-backlog-view>

                <!-- Card Detail Panel (Backlog tab) -->
                <template lwc:if={showCardDetail}>
                    <c-kanban-card-panel
                        card={selectedCard}
                        store={store}
                        is-open={showCardDetail}
                        initial-panel-width={_cardPanelWidth}
                        onclose={handleCardDetailClose}
                        oncardupdated={handleCardUpdated}
                        oncarddeleted={handleCardDeleted}
                        onpanelresize={handleCardPanelResize}
                        onnavigatetocard={handlePanelNavigateToCard}
                    ></c-kanban-card-panel>
                </template>
            </div>
        </template>

        <!-- Columns Tab Content (internal only) -->
        <template lwc:if={showColumnsContent}>
            <div class="kanban-columns-container">
                <c-column-management
                    store={store}
                ></c-column-management>
            </div>
        </template>
    </div>

    <!-- Sprint Modals (internal only) -->
    <template lwc:if={isInternalMode}>
        <!-- Sprint Modal -->
        <template lwc:if={showSprintModal}>
            <c-kanban-sprint-modal
                store={store}
                board-id={recordId}
                sprint={editSprint}
                is-open={showSprintModal}
                default-duration-days={defaultSprintDurationDays}
                has-active-sprint={hasActiveSprint}
                onclose={handleSprintModalClose}
                onsprintcreated={handleSprintCreated}
                onsprintupdated={handleSprintCreated}
                onsprintstarted={handleSprintStarted}
            ></c-kanban-sprint-modal>
        </template>

        <!-- Sprint Complete Modal -->
        <template lwc:if={showSprintComplete}>
            <c-kanban-sprint-complete
                store={store}
                sprint-id={activeSprintId}
                is-open={showSprintComplete}
                onclose={handleSprintCompleteClose}
                onsprintcompleted={handleSprintCompleted}
            ></c-kanban-sprint-complete>
        </template>

        <!-- Sprint Reports Modal -->
        <template lwc:if={showSprintReports}>
            <c-kanban-sprint-reports
                store={store}
                sprint-id={activeSprintId}
                board-id={recordId}
                is-open={showSprintReports}
                onclose={handleSprintReportsClose}
            ></c-kanban-sprint-reports>
        </template>
    </template>

    <!-- Analytics Modal -->
    <template lwc:if={showAnalytics}>
        <c-kanban-analytics
            store={store}
            board-id={recordId}
            is-open={showAnalytics}
            onclose={handleAnalyticsClose}
        ></c-kanban-analytics>
    </template>

    <!-- Reusable Managers -->
    <c-subscription-manager
        channel-name={subscriptionChannelName}
        auto-subscribe={shouldAutoSubscribe}
        board-id={recordId}
        onmessage={handleSubscriptionMessage}
        onstatusmessage={handleSubscriptionStatusMessage}
        onstatuschange={handleSubscriptionStatusChange}
        onpollingrequired={handlePollingRequired}
    ></c-subscription-manager>

    <!-- Sprint Event Subscription -->
    <template lwc:if={isSprintBoard}>
        <c-subscription-manager
            channel-name={sprintSubscriptionChannelName}
            auto-subscribe={shouldAutoSubscribe}
            board-id={recordId}
            onmessage={handleSprintSubscriptionMessage}
        ></c-subscription-manager>
    </template>

    <c-toast-manager></c-toast-manager>

    <c-navigation-util></c-navigation-util>
</template>
