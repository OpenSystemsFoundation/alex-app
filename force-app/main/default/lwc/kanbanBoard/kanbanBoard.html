<template>
    <lightning-card title={boardName} icon-name="custom:custom78">
        <div slot="actions">
            <lightning-button
                label="Refresh"
                icon-name="utility:refresh"
                onclick={handleRefresh}
            ></lightning-button>
        </div>
        
        <div class="kanban-container" style={boardStyle}>
            <template if:true={hasColumns}>
                <div class="kanban-board">
                    <template for:each={columns} for:item="column">
                        <div
                            key={column.Id}
                            class="kanban-column"
                            data-column-id={column.Id}
                        >
                            <!-- Column Header -->
                            <div class="column-header" style={column.columnStyle}>
                                <div class="column-title">
                                    <h3>{column.columnHeader}</h3>
                                    <span class="card-count">{column.cardCount}</span>
                                </div>
                                <lightning-button-icon
                                    icon-name="utility:add"
                                    alternative-text="Add Card"
                                    title="Add Card"
                                    data-column-id={column.Id}
                                    onclick={handleAddCard}
                                ></lightning-button-icon>
                            </div>
                            
                            <!-- Cards -->
                            <div 
                                class="cards-container"
                                data-column-id={column.Id}
                                ondragover={handleDragOver}
                                ondrop={handleDrop}
                            >
                                <template for:each={column.cards} for:item="card">
                                    <div
                                        key={card.Id}
                                        class="kanban-card"
                                        data-card-id={card.Id}
                                        data-column-id={column.Id}
                                        draggable="true"
                                        ondragstart={handleDragStart}
                                        ondragend={handleDragEnd}
                                        onclick={handleCardClick}
                                        style={card.cardStyle}
                                    >
                                        <!-- Card Content -->
                                        <div class="card-header">
                                            <span class="card-name">{card.Name}</span>
                                            <template if:true={card.priority}>
                                                <span class={card.priorityClass}>
                                                    {card.priority}
                                                </span>
                                            </template>
                                        </div>
                                        
                                        <div class="card-subject">{card.subject}</div>
                                        
                                        <template if:true={card.description}>
                                            <div class="card-description">{card.description}</div>
                                        </template>
                                        
                                        <div class="card-footer">
                                            <div class="card-meta">
                                                <template if:true={card.cardType}>
                                                    <span class="card-type">{card.cardType}</span>
                                                </template>
                                                
                                                <template if:true={card.storyPoints}>
                                                    <span class="story-points">
                                                        <lightning-icon
                                                            icon-name="utility:diamond"
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                        {card.storyPoints}
                                                    </span>
                                                </template>
                                                
                                                <template if:true={card.formattedDueDate}>
                                                    <span class={card.isOverdue}>
                                                        <lightning-icon
                                                            icon-name="utility:clock"
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                        {card.formattedDueDate}
                                                    </span>
                                                </template>
                                            </div>
                                            
                                            <template if:true={card.hasAssignee}>
                                                <div class="assignee">
                                                    <template if:true={card.assignee.photoUrl}>
                                                        <img
                                                            src={card.assignee.photoUrl}
                                                            alt={card.assignee.name}
                                                            class="assignee-avatar"
                                                        />
                                                    </template>
                                                    <template if:false={card.assignee.photoUrl}>
                                                        <div class="assignee-initials">
                                                            {card.assigneeInitials}
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                
                                <!-- Empty state -->
                                <template if:false={column.cards.length}>
                                    <div class="empty-column">
                                        Drop cards here
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            
            <!-- Loading state -->
            <template if:true={isLoading}>
                <div class="loading-state">
                    <lightning-spinner
                        alternative-text="Loading"
                        size="medium"
                    ></lightning-spinner>
                </div>
            </template>
            
            <!-- Empty state -->
            <template if:true={showEmptyState}>
                <div class="empty-state">
                    <p>No columns found. Please add columns to this board.</p>
                </div>
            </template>
        </div>
    </lightning-card>
    
    <!-- Card Detail Modal -->
    <template if:true={showCardDetail}>
        <c-kanban-card-detail
            card={selectedCard}
            is-open={showCardDetail}
            onclose={handleCardDetailClose}
            oncardupdated={handleCardUpdated}
            oncarddeleted={handleCardDeleted}
        ></c-kanban-card-detail>
    </template>
</template>
