<template>
    <lightning-card
        title={boardName}
        icon-name="custom:custom78"
    >
        <div slot="actions">
            <lightning-button
                label="Refresh"
                icon-name="utility:refresh"
                onclick={handleRefresh}
            ></lightning-button>
        </div>

        <!-- Loading State -->
        <template lwc:if={isLoading}>
            <div
                class="slds-is-relative slds-align_absolute-center slds-var-m-top_medium"
            >
                <lightning-spinner
                    alternative-text="Loading"
                    size="large"
                ></lightning-spinner>
            </div>
        </template>

        <!-- Error State -->
        <template lwc:if={error}>
            <div
                class="kanban__error slds-text-color_error slds-is-relative slds-align_absolute-center slds-var-m-top_medium"
            >
                <lightning-formatted-text
                    value={error}
                ></lightning-formatted-text>
            </div>
        </template>

        <!-- Kanban Board -->
        <div
            class="kanban-board slds-grid slds-scrollable_x"
            style={boardStyle}
        >
            <template lwc:if={hasColumns}>
                <template
                    for:each={columns}
                    for:item="column"
                >
                    <!-- Kanban Column -->
                    <div
                        key={column.Id}
                        class="kanban-column slds-col slds-grid slds-grid_vertical slds-var-m-around_x-small"
                        data-column-id={column.Id}
                        style={column.columnStyle}
                    >
                        <!-- Column Header -->
                        <div
                            class="kanban-column__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-p-horizontal_small slds-var-p-top_x-small"
                        >
                            <div
                                class="slds-col slds-truncate"
                            >
                                <div
                                    class="slds-media__body slds-truncate"
                                >
                                    <h2
                                        class="slds-text-heading_medium slds-truncate slds-var-p-bottom_xx-small"
                                    >
                                        <a
                                            href={column.columnUrl}
                                            class="slds-text-link slds-text-color_brand slds-truncate"
                                            title={column.columnHeader}
                                            onclick={handleColumnClick}
                                            data-column-id={column.Id}
                                        >
                                            <span
                                                class="slds-truncate"
                                                >{column.columnHeader}</span
                                            >
                                        </a>
                                    </h2>
                                    <p
                                        class="slds-text-body_small"
                                    >
                                        <lightning-badge
                                            label={column.cardCount}
                                        ></lightning-badge>
                                    </p>
                                </div>
                            </div>

                            <!-- Add Card Button -->
                            <div class="add-button-wrapper">
                                <button
                                    class="add-card-button slds-button slds-button_icon slds-button_icon-border-filled"
                                    data-column-id={column.Id}
                                    onclick={handleAddCard}
                                    title="Add New Card"
                                >
                                    <lightning-icon
                                        icon-name="utility:add"
                                        alternative-text="Add New Card"
                                        size="small"
                                    ></lightning-icon>
                                    <span
                                        class="slds-assistive-text"
                                        >Add New Card</span
                                    >
                                </button>
                            </div>
                        </div>

                        <!-- Scrollable Card Wrapper -->
                        <div
                            class="kanban-column__card-wrapper slds-scrollable_y slds-var-p-top_x-small"
                            data-column-id={column.Id}
                            ondragover={handleDragOver}
                            ondrop={handleDrop}
                        >
                            <template
                                lwc:if={column.cards.length}
                            >
                                <template
                                    for:each={column.cards}
                                    for:item="card"
                                >
                                    <article
                                        key={card.Id}
                                        class="kanban-card slds-box slds-box_small slds-var-m-horizontal_x-small"
                                        data-card-id={card.Id}
                                        data-column-id={column.Id}
                                        draggable="true"
                                        ondragstart={handleDragStart}
                                        ondragend={handleDragEnd}
                                        onclick={handleCardClick}
                                        style={card.cardStyle}
                                    >
                                        <!-- Card Header -->
                                        <header
                                            class="slds-media slds-media_center slds-has-flexi-truncate slds-var-p-bottom_xx-small"
                                        >
                                            <template
                                                lwc:if={card.hasAssignee}
                                            >
                                                <!-- Assignee Avatar -->
                                                <div
                                                    class="slds-media__figure"
                                                >
                                                    <template
                                                        lwc:if={card.assignee.photoUrl}
                                                    >
                                                        <span
                                                            class="slds-avatar slds-avatar_circle"
                                                        >
                                                            <img
                                                                src={card.assignee.photoUrl}
                                                                alt={card.assignee.name}
                                                                title={card.assignee.name}
                                                            />
                                                        </span>
                                                    </template>
                                                    <template
                                                        lwc:else
                                                    >
                                                        <span
                                                            class="slds-avatar slds-avatar_circle slds-avatar_medium"
                                                        >
                                                            <span
                                                                class="slds-avatar__initials"
                                                            >
                                                                {card.assigneeInitials}
                                                            </span>
                                                        </span>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Card Title -->
                                            <div
                                                class="slds-media__body slds-truncate"
                                            >
                                                <h2
                                                    class="slds-card__header-title slds-truncate slds-text-body_small"
                                                >
                                                    <a
                                                        href={card.recordUrl}
                                                        class="slds-text-link slds-text-color_brand slds-truncate"
                                                        title={card.Name}
                                                        onclick={handleCardNameClick}
                                                        data-card-id={card.Id}
                                                    >
                                                        <span
                                                            class="slds-truncate"
                                                            >{card.Name}</span
                                                        >
                                                    </a>
                                                </h2>

                                                <p
                                                    class="slds-text-body_small slds-truncate"
                                                >
                                                    <template
                                                        lwc:if={card.cardType}
                                                    >
                                                        <span
                                                            >{card.cardType}</span
                                                        >
                                                        <template
                                                            lwc:if={card.status}
                                                        >
                                                            <span
                                                                >&nbsp;-&nbsp;</span
                                                            >
                                                        </template>
                                                    </template>
                                                    <template
                                                        lwc:if={card.status}
                                                    >
                                                        <span>
                                                            {card.status}
                                                        </span>
                                                    </template>
                                                </p>
                                            </div>
                                        </header>

                                        <!-- Card Body -->
                                        <div
                                            class="kanban-card__body slds-text-body_regular"
                                        >
                                            <template
                                                lwc:if={card.subject}
                                            >
                                                <p
                                                    class="slds-truncate slds-text-title"
                                                >
                                                    {card.subject}
                                                </p>
                                            </template>

                                            <template
                                                lwc:if={card.description}
                                            >
                                                <p
                                                    class="slds-text-body_small slds-truncate slds-var-m-top_xx-small"
                                                >
                                                    {card.description}
                                                </p>
                                            </template>

                                            <!-- Card Icons -->
                                            <div
                                                class="kanban-card__body-icons slds-grid slds-wrap slds-grid_align-spread slds-var-p-top_small"
                                            >
                                                <!-- Left side: Priority and Due Date -->
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <template
                                                        lwc:if={card.priority}
                                                    >
                                                        <div
                                                            class="slds-var-p-right_small"
                                                        >
                                                            <span class="slds-badge priority-pill">
                                                                <span class={card.priorityClass}>
                                                                    {card.priority}
                                                                </span>
                                                            </span>
                                                        </div>
                                                    </template>
                                                    
                                                    <template
                                                        lwc:if={card.formattedDueDate}
                                                    >
                                                        <div>
                                                            <span class="slds-badge due-date-pill">
                                                                <lightning-icon
                                                                    icon-name="utility:clock"
                                                                    size="xx-small"
                                                                    class="date-icon"
                                                                ></lightning-icon>
                                                                <span class={card.isOverdue}>
                                                                    {card.formattedDueDate}
                                                                </span>
                                                            </span>
                                                        </div>
                                                    </template>
                                                </div>
                                                
                                                <!-- Right side: Story Points -->
                                                <template
                                                    lwc:if={card.storyPoints}
                                                >
                                                    <div>
                                                        <span class="slds-avatar slds-avatar_circle slds-avatar_x-small story-points-badge">
                                                            <span class="slds-avatar__initials">
                                                                {card.storyPoints}
                                                            </span>
                                                        </span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </article>
                                </template>
                            </template>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Empty Board State -->
            <template lwc:else>
                <div
                    class="slds-text-align_center slds-var-m-top_medium slds-var-p-around_medium"
                >
                    <p class="slds-text-body_regular">
                        No columns found. Please add columns
                        to this board! 🚀
                    </p>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Card Detail Modal -->
    <template if:true={showCardDetail}>
        <c-kanban-card-detail
            card={selectedCard}
            is-open={showCardDetail}
            onclose={handleCardDetailClose}
            oncardupdated={handleCardUpdated}
            oncarddeleted={handleCardDeleted}
        ></c-kanban-card-detail>
    </template>
</template>
