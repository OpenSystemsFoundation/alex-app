<template>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <div class="header-content">
                <lightning-icon
                    icon-name="standard:settings"
                    size="medium"
                ></lightning-icon>
                <div class="header-text">
                    <h1 class="slds-text-heading_large">
                        Admin Management
                    </h1>
                    <p
                        class="slds-text-body_regular slds-text-color_weak"
                    >
                        Configure boards, columns, and app
                        settings
                    </p>
                </div>
            </div>
        </div>

        <!-- Onboarding Banner -->
        <template lwc:if={showOnboarding}>
            <div class="onboarding-banner">
                <lightning-card>
                    <div slot="title">
                        <lightning-icon
                            icon-name="utility:setup"
                            size="small"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        Getting Started
                    </div>
                    <div class="onboarding-content">
                        <p class="slds-m-bottom_medium">
                            Complete these steps to set up
                            your workspace:
                        </p>
                        <lightning-progress-indicator
                            current-step={onboardingCurrentStep}
                            type="base"
                            variant="base"
                        >
                            <lightning-progress-step
                                label="Create a Board"
                                value="board"
                            ></lightning-progress-step>
                            <lightning-progress-step
                                label="Set Up Columns"
                                value="columns"
                            ></lightning-progress-step>
                            <lightning-progress-step
                                label="Assign Users"
                                value="users"
                            ></lightning-progress-step>
                        </lightning-progress-indicator>
                        <div
                            class="onboarding-actions slds-m-top_medium"
                        >
                            <template
                                lwc:if={showCreateFirstBoard}
                            >
                                <lightning-button
                                    variant="brand"
                                    label="Create Your First Board"
                                    onclick={handleQuickCreateBoard}
                                    icon-name="utility:add"
                                ></lightning-button>
                            </template>
                            <template
                                lwc:if={showSetupColumns}
                            >
                                <p
                                    class="slds-text-body_regular slds-m-bottom_small"
                                >
                                    Select a board below to
                                    configure its columns.
                                </p>
                            </template>
                            <template
                                lwc:if={showAssignUsers}
                            >
                                <p
                                    class="slds-text-body_regular"
                                >
                                    Assign the
                                    <strong
                                        >Alex Admin</strong
                                    >
                                    or
                                    <strong
                                        >Alex User</strong
                                    >
                                    permission sets to your
                                    team members in
                                    Salesforce Setup.
                                </p>
                            </template>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </template>

        <!-- Navigation Tabs -->
        <div class="admin-nav">
            <lightning-tabset active-tab-value={activeTab}>
                <lightning-tab
                    label="Boards"
                    value="boards"
                    icon-name="standard:kanban"
                    onactive={handleTabChange}
                >
                    <!-- Boards Section -->
                    <div class="section-content">
                        <div class="section-header">
                            <h2
                                class="slds-text-heading_medium"
                            >
                                Boards
                            </h2>
                            <lightning-button
                                variant="brand"
                                label="New Board"
                                onclick={handleNewBoard}
                                icon-name="utility:add"
                            ></lightning-button>
                        </div>

                        <template lwc:if={isLoading}>
                            <lightning-spinner
                                alternative-text="Loading"
                                size="medium"
                            ></lightning-spinner>
                        </template>

                        <template lwc:if={hasBoards}>
                            <div class="boards-grid">
                                <template
                                    for:each={boards}
                                    for:item="board"
                                >
                                    <div
                                        key={board.Id}
                                        class="board-card"
                                    >
                                        <lightning-card>
                                            <div
                                                slot="title"
                                            >
                                                <span
                                                    class="board-name"
                                                    >{board.Name}</span
                                                >
                                                <template
                                                    lwc:if={board.active}
                                                >
                                                    <lightning-badge
                                                        label="Active"
                                                        class="slds-m-left_x-small badge-active"
                                                    ></lightning-badge>
                                                </template>
                                            </div>
                                            <lightning-button-menu
                                                slot="actions"
                                                alternative-text="Board Actions"
                                                menu-alignment="right"
                                                icon-size="x-small"
                                            >
                                                <lightning-menu-item
                                                    label="Edit"
                                                    value="edit"
                                                    data-board-id={board.Id}
                                                    onclick={handleBoardAction}
                                                    icon-name="utility:edit"
                                                ></lightning-menu-item>
                                                <lightning-menu-item
                                                    label="Manage Columns"
                                                    value="columns"
                                                    data-board-id={board.Id}
                                                    onclick={handleBoardAction}
                                                    icon-name="utility:layout"
                                                ></lightning-menu-item>
                                                <lightning-menu-item
                                                    label="Delete"
                                                    value="delete"
                                                    data-board-id={board.Id}
                                                    onclick={handleBoardAction}
                                                    icon-name="utility:delete"
                                                ></lightning-menu-item>
                                            </lightning-button-menu>
                                            <div
                                                class="board-details"
                                            >
                                                <p
                                                    class="board-description"
                                                    lwc:if={board.description}
                                                >
                                                    {board.description}
                                                </p>
                                                <div
                                                    class="board-meta"
                                                >
                                                    <span
                                                        class="meta-item"
                                                    >
                                                        <lightning-icon
                                                            icon-name="utility:layout"
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                        {board.type}
                                                    </span>
                                                    <span
                                                        class="meta-item"
                                                    >
                                                        <lightning-icon
                                                            icon-name="utility:check"
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                        {board.status}
                                                    </span>
                                                </div>
                                                <div
                                                    class="board-actions-row slds-m-top_small"
                                                >
                                                    <lightning-button
                                                        variant="neutral"
                                                        label="Manage Columns"
                                                        data-board-id={board.Id}
                                                        onclick={handleManageColumns}
                                                        icon-name="utility:layout"
                                                    ></lightning-button>
                                                </div>
                                            </div>
                                        </lightning-card>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template lwc:if={noBoards}>
                            <div class="empty-state">
                                <lightning-icon
                                    icon-name="standard:kanban"
                                    size="large"
                                ></lightning-icon>
                                <h3
                                    class="slds-m-top_medium"
                                >
                                    No Boards Yet
                                </h3>
                                <p
                                    class="slds-text-color_weak"
                                >
                                    Create your first board
                                    to get started.
                                </p>
                                <lightning-button
                                    variant="brand"
                                    label="Create Board"
                                    onclick={handleNewBoard}
                                    icon-name="utility:add"
                                    class="slds-m-top_medium"
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab
                    label="Column Manager"
                    value="columns"
                    icon-name="standard:column"
                    onactive={handleTabChange}
                >
                    <!-- Column Manager Section -->
                    <div class="section-content">
                        <div class="section-header">
                            <h2
                                class="slds-text-heading_medium"
                            >
                                Column Manager
                            </h2>
                            <div class="column-controls">
                                <lightning-combobox
                                    label="Select Board"
                                    value={selectedBoardId}
                                    options={boardOptions}
                                    onchange={handleBoardSelect}
                                    placeholder="Choose a board..."
                                    variant="label-hidden"
                                    class="board-select"
                                ></lightning-combobox>
                                <template
                                    lwc:if={selectedBoardId}
                                >
                                    <lightning-button
                                        variant="brand"
                                        label="Add Column"
                                        onclick={handleNewColumn}
                                        icon-name="utility:add"
                                    ></lightning-button>
                                </template>
                            </div>
                        </div>

                        <template lwc:if={isLoadingColumns}>
                            <lightning-spinner
                                alternative-text="Loading columns"
                                size="medium"
                            ></lightning-spinner>
                        </template>

                        <template lwc:if={showColumnList}>
                            <p
                                class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
                            >
                                Drag columns to reorder
                                them. Changes are saved
                                automatically.
                            </p>
                            <div
                                class="columns-list"
                                ondragover={handleColumnDragOver}
                                ondrop={handleColumnDrop}
                            >
                                <template
                                    for:each={columns}
                                    for:item="column"
                                >
                                    <div
                                        key={column.Id}
                                        class={column.cssClass}
                                        draggable="true"
                                        data-column-id={column.Id}
                                        data-index={column.index}
                                        ondragstart={handleColumnDragStart}
                                        ondragend={handleColumnDragEnd}
                                        ondragenter={handleColumnDragEnter}
                                    >
                                        <div
                                            class="column-drag-handle"
                                        >
                                            <lightning-icon
                                                icon-name="utility:drag_and_drop"
                                                size="x-small"
                                                alternative-text="Drag to reorder"
                                            ></lightning-icon>
                                        </div>
                                        <div
                                            class="column-color-indicator"
                                            style={column.colorStyle}
                                        ></div>
                                        <div
                                            class="column-info"
                                        >
                                            <span
                                                class="column-header-text"
                                                >{column.columnHeader}</span
                                            >
                                            <span
                                                class="column-category"
                                                lwc:if={column.category}
                                                >{column.category}</span
                                            >
                                        </div>
                                        <div
                                            class="column-card-count"
                                        >
                                            <lightning-badge
                                                label={column.cardCountLabel}
                                            ></lightning-badge>
                                        </div>
                                        <div
                                            class="column-actions"
                                        >
                                            <lightning-button-icon
                                                icon-name="utility:edit"
                                                alternative-text="Edit column"
                                                data-column-id={column.Id}
                                                onclick={handleEditColumn}
                                                variant="border"
                                                size="small"
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Delete column"
                                                data-column-id={column.Id}
                                                onclick={handleDeleteColumn}
                                                variant="border"
                                                size="small"
                                            ></lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template
                            lwc:if={showNoColumnsMessage}
                        >
                            <div class="empty-state">
                                <lightning-icon
                                    icon-name="standard:column"
                                    size="large"
                                ></lightning-icon>
                                <h3
                                    class="slds-m-top_medium"
                                >
                                    No Columns Yet
                                </h3>
                                <p
                                    class="slds-text-color_weak"
                                >
                                    Add columns to organize
                                    your board.
                                </p>
                                <lightning-button
                                    variant="brand"
                                    label="Add Column"
                                    onclick={handleNewColumn}
                                    icon-name="utility:add"
                                    class="slds-m-top_medium"
                                ></lightning-button>
                            </div>
                        </template>

                        <template
                            lwc:if={showSelectBoardMessage}
                        >
                            <div class="empty-state">
                                <lightning-icon
                                    icon-name="utility:info"
                                    size="large"
                                ></lightning-icon>
                                <h3
                                    class="slds-m-top_medium"
                                >
                                    Select a Board
                                </h3>
                                <p
                                    class="slds-text-color_weak"
                                >
                                    Choose a board from the
                                    dropdown above to manage
                                    its columns.
                                </p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab
                    label="Settings"
                    value="settings"
                    icon-name="standard:settings"
                    onactive={handleTabChange}
                >
                    <!-- Settings Section -->
                    <div class="section-content">
                        <h2
                            class="slds-text-heading_medium slds-m-bottom_medium"
                        >
                            Global Settings
                        </h2>

                        <lightning-card
                            title="Permission Sets"
                        >
                            <div class="settings-section">
                                <p
                                    class="slds-text-body_regular slds-m-bottom_small"
                                >
                                    Manage user access by
                                    assigning permission
                                    sets in Salesforce
                                    Setup.
                                </p>
                                <div
                                    class="permission-sets-list"
                                >
                                    <div
                                        class="permission-set-item"
                                    >
                                        <lightning-icon
                                            icon-name="utility:shield"
                                            size="small"
                                        ></lightning-icon>
                                        <div>
                                            <strong
                                                >Alex
                                                Admin</strong
                                            >
                                            <p
                                                class="slds-text-color_weak"
                                            >
                                                Full access
                                                to all
                                                objects,
                                                boards, and
                                                admin
                                                features.
                                            </p>
                                        </div>
                                    </div>
                                    <div
                                        class="permission-set-item"
                                    >
                                        <lightning-icon
                                            icon-name="utility:user"
                                            size="small"
                                        ></lightning-icon>
                                        <div>
                                            <strong
                                                >Alex
                                                User</strong
                                            >
                                            <p
                                                class="slds-text-color_weak"
                                            >
                                                Standard
                                                user access
                                                to boards
                                                and cards.
                                            </p>
                                        </div>
                                    </div>
                                    <div
                                        class="permission-set-item"
                                    >
                                        <lightning-icon
                                            icon-name="utility:preview"
                                            size="small"
                                        ></lightning-icon>
                                        <div>
                                            <strong
                                                >View Hidden
                                                Boards</strong
                                            >
                                            <p
                                                class="slds-text-color_weak"
                                            >
                                                Allows
                                                viewing
                                                boards
                                                marked as
                                                hidden.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </lightning-card>

                        <lightning-card
                            title="About"
                            class="slds-m-top_medium"
                        >
                            <div class="settings-section">
                                <div class="about-info">
                                    <p>
                                        <strong
                                            >Alex</strong
                                        >
                                        - Kanban Board
                                        Management
                                    </p>
                                    <p
                                        class="slds-text-color_weak"
                                    >
                                        Namespace: OpenSF
                                    </p>
                                </div>
                            </div>
                        </lightning-card>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </div>

        <!-- Board Create/Edit Modal -->
        <template lwc:if={showBoardModal}>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open"
                aria-modal="true"
                aria-labelledby="board-modal-heading"
            >
                <div class="slds-modal__container">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small"
                            variant="inverse"
                        ></lightning-icon>
                    </button>
                    <div class="slds-modal__header">
                        <h2
                            id="board-modal-heading"
                            class="slds-modal__title slds-hyphenate"
                        >
                            {boardModalTitle}
                        </h2>
                    </div>
                    <div
                        class="slds-modal__content slds-p-around_medium"
                    >
                        <lightning-input
                            label="Board Name"
                            value={boardForm.name}
                            onchange={handleBoardFormChange}
                            data-field="name"
                            required
                        ></lightning-input>
                        <lightning-textarea
                            label="Description"
                            value={boardForm.description}
                            onchange={handleBoardFormChange}
                            data-field="description"
                            class="slds-m-top_small"
                        ></lightning-textarea>
                        <lightning-combobox
                            label="Board Type"
                            value={boardForm.type}
                            options={boardTypeOptions}
                            onchange={handleBoardFormChange}
                            data-field="type"
                            class="slds-m-top_small"
                        ></lightning-combobox>
                        <template lwc:if={isEditingBoard}>
                            <lightning-input
                                type="toggle"
                                label="Active"
                                checked={boardForm.active}
                                onchange={handleBoardFormChange}
                                data-field="active"
                                class="slds-m-top_small"
                            ></lightning-input>
                            <lightning-input
                                type="toggle"
                                label="Email Notifications"
                                checked={boardForm.emailNotifications}
                                onchange={handleBoardFormChange}
                                data-field="emailNotifications"
                                class="slds-m-top_small"
                            ></lightning-input>
                            <lightning-input
                                type="toggle"
                                label="Salesforce Notifications"
                                checked={boardForm.salesforceNotifications}
                                onchange={handleBoardFormChange}
                                data-field="salesforceNotifications"
                                class="slds-m-top_small"
                            ></lightning-input>
                        </template>
                        <template
                            lwc:if={showDefaultColumnsOption}
                        >
                            <lightning-input
                                type="checkbox"
                                label="Create with default columns (To Do, In Progress, In Review, Done)"
                                checked={createWithDefaults}
                                onchange={handleDefaultColumnsChange}
                                class="slds-m-top_medium"
                            ></lightning-input>
                        </template>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseModal}
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label={boardModalSaveLabel}
                            onclick={handleSaveBoard}
                            disabled={isSaving}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </section>
            <div
                class="slds-backdrop slds-backdrop_open"
            ></div>
        </template>

        <!-- Column Create/Edit Modal -->
        <template lwc:if={showColumnModal}>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open"
                aria-modal="true"
                aria-labelledby="column-modal-heading"
            >
                <div class="slds-modal__container">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseColumnModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small"
                            variant="inverse"
                        ></lightning-icon>
                    </button>
                    <div class="slds-modal__header">
                        <h2
                            id="column-modal-heading"
                            class="slds-modal__title slds-hyphenate"
                        >
                            {columnModalTitle}
                        </h2>
                    </div>
                    <div
                        class="slds-modal__content slds-p-around_medium"
                    >
                        <lightning-input
                            label="Column Header"
                            value={columnForm.columnHeader}
                            onchange={handleColumnFormChange}
                            data-field="columnHeader"
                            required
                        ></lightning-input>
                        <lightning-combobox
                            label="Category"
                            value={columnForm.category}
                            options={columnCategoryOptions}
                            onchange={handleColumnFormChange}
                            data-field="category"
                            class="slds-m-top_small"
                        ></lightning-combobox>
                        <lightning-input
                            type="color"
                            label="Color"
                            value={columnForm.color}
                            onchange={handleColumnFormChange}
                            data-field="color"
                            class="slds-m-top_small"
                        ></lightning-input>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseColumnModal}
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label={columnModalSaveLabel}
                            onclick={handleSaveColumn}
                            disabled={isSaving}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </section>
            <div
                class="slds-backdrop slds-backdrop_open"
            ></div>
        </template>

        <!-- Delete Confirmation Modal -->
        <template lwc:if={showDeleteModal}>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open slds-modal_small"
                aria-modal="true"
                aria-labelledby="delete-modal-heading"
            >
                <div class="slds-modal__container">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleCloseDeleteModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small"
                            variant="inverse"
                        ></lightning-icon>
                    </button>
                    <div
                        class="slds-modal__header slds-theme_error"
                    >
                        <h2
                            id="delete-modal-heading"
                            class="slds-modal__title slds-hyphenate"
                        >
                            Confirm Delete
                        </h2>
                    </div>
                    <div
                        class="slds-modal__content slds-p-around_medium"
                    >
                        <p>{deleteMessage}</p>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseDeleteModal}
                        ></lightning-button>
                        <lightning-button
                            variant="destructive"
                            label="Delete"
                            onclick={handleConfirmDelete}
                            disabled={isSaving}
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </section>
            <div
                class="slds-backdrop slds-backdrop_open"
            ></div>
        </template>
    </div>
</template>
