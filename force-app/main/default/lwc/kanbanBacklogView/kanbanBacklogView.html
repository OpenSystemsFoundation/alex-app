<template>
    <div class="backlog-view">
        <!-- Toolbar -->
        <c-kanban-filter-bar
            search-value={searchTerm}
            search-placeholder="Search cards..."
            show-view-filter
            view-value={viewMode}
            view-options={viewModeOptions}
            show-priority-filter
            priority-value={filterPriority}
            priority-options={priorityFilterOptions}
            show-card-type-filter
            card-type-value={filterCardType}
            card-type-options={cardTypeFilterOptions}
            show-epic-filter={hasEpics}
            epic-value={filterEpic}
            epic-options={epicFilterOptions}
            show-assignee-filter={hasAssigneeOptions}
            assignee-value={filterAssignees}
            assignee-options={assigneeFilterOptions}
            show-info-text={hasBacklogInfoText}
            info-text={backlogInfoText}
            show-busy-state={isBacklogSaving}
            busy-label="Saving..."
            show-clear-filters={hasActiveFilters}
            show-new-sprint={isSprintBoard}
            show-new-card
            onsearchinput={handleSearchChange}
            onviewchange={handleViewModeChange}
            onprioritychange={handlePriorityFilterChange}
            oncardtypechange={handleCardTypeFilterChange}
            onepicchange={handleEpicFilterChange}
            onassigneechange={handleAssigneeFilterChange}
            onclearfilters={handleClearFilters}
            oncreatesprint={handleToggleCreateSprintForm}
            oncreatecard={handleToggleCreateForm}
        ></c-kanban-filter-bar>

        <!-- Bulk Action Bar -->
        <template lwc:if={hasSelectedCards}>
            <div
                class="backlog-view__bulk-actions slds-grid slds-grid_vertical-align-center slds-gutters_x-small slds-var-p-horizontal_small slds-var-p-vertical_x-small"
            >
                <span
                    class="slds-text-body_small slds-var-m-right_small"
                    ><strong>{selectedCount}</strong>
                    selected</span
                >
                <template lwc:if={hasActiveSprint}>
                    <lightning-button
                        label={addToSprintLabel}
                        onclick={handleBulkAddToSprint}
                        variant="brand"
                        class="slds-var-m-right_x-small"
                    ></lightning-button>
                </template>
                <template lwc:if={hasBulkSprintOptions}>
                    <lightning-combobox
                        label="Move to Sprint"
                        options={bulkSprintOptions}
                        onchange={handleBulkMoveToSprint}
                        variant="label-hidden"
                        placeholder="Move to Sprint"
                        class="backlog-filter slds-var-m-right_x-small"
                    ></lightning-combobox>
                </template>
                <lightning-button-group class="slds-var-m-right_x-small">
                    <lightning-button
                        label="Move to Top"
                        onclick={handleBulkMoveTop}
                        icon-name="utility:arrowup"
                    ></lightning-button>
                    <lightning-button
                        label="Move to Bottom"
                        onclick={handleBulkMoveBottom}
                        icon-name="utility:arrowdown"
                    ></lightning-button>
                </lightning-button-group>
                <lightning-combobox
                    label="Set Priority"
                    options={priorityOptions}
                    onchange={handleBulkSetPriority}
                    variant="label-hidden"
                    placeholder="Set Priority"
                    class="backlog-filter slds-var-m-right_x-small"
                ></lightning-combobox>
                <lightning-button
                    label="Delete"
                    onclick={handleBulkDelete}
                    variant="destructive-text"
                    icon-name="utility:delete"
                    class="slds-var-m-right_x-small"
                ></lightning-button>
                <lightning-button
                    label="Clear"
                    onclick={handleDeselectAll}
                    variant="neutral"
                ></lightning-button>
            </div>
        </template>

        <!-- Create Sprint Form -->
        <template lwc:if={showCreateSprintForm}>
            <div
                class="backlog-view__create-form slds-grid slds-grid_vertical-align-center slds-gutters_xx-small slds-var-p-horizontal_small slds-var-p-vertical_x-small"
            >
                <div
                    class="slds-col slds-no-flex slds-var-m-right_x-small"
                >
                    <lightning-icon
                        icon-name="utility:sprint"
                        size="x-small"
                        alternative-text="Sprint"
                    ></lightning-icon>
                </div>
                <div class="slds-col slds-grow">
                    <lightning-input
                        label="Sprint goal"
                        value={newSprintGoal}
                        onchange={handleNewSprintGoalChange}
                        onkeydown={handleCreateSprintKeyDown}
                        placeholder="Sprint goal (optional)"
                        variant="label-hidden"
                        class="create-sprint-input"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Create Sprint"
                        variant="brand"
                        onclick={handleCreateSprint}
                    ></lightning-button>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelCreateSprint}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <!-- Create Card Form -->
        <template lwc:if={showCreateForm}>
            <div
                class="backlog-view__create-form slds-grid slds-grid_vertical-align-center slds-gutters_xx-small slds-var-p-horizontal_small slds-var-p-vertical_x-small"
            >
                <div class="slds-col slds-grow">
                    <lightning-input
                        label="Card subject"
                        value={newCardSubject}
                        onchange={handleNewSubjectChange}
                        onkeydown={handleCreateKeyDown}
                        placeholder="What needs to be done?"
                        variant="label-hidden"
                        class="create-input"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleCreateCard}
                        disabled={isCreateDisabled}
                    ></lightning-button>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelCreate}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <!-- Card List Table -->
        <div class="backlog-view__table">
            <template lwc:if={hasContent}>
                <!-- Table Header -->
                <div
                    class="backlog-row backlog-row--header slds-grid slds-grid_vertical-align-center"
                >
                    <div
                        class="backlog-cell backlog-cell--drag"
                    ></div>
                    <div
                        class="backlog-cell backlog-cell--checkbox"
                    >
                        <lightning-input
                            type="checkbox"
                            checked={isAllSelected}
                            onchange={handleSelectAll}
                            variant="label-hidden"
                            label="Select All"
                        ></lightning-input>
                    </div>
                    <div
                        class="backlog-cell backlog-cell--refinement"
                        title="Needs Refinement"
                    >
                        <lightning-icon
                            icon-name="utility:search"
                            size="xx-small"
                            alternative-text="Refinement"
                            class="header-icon"
                        ></lightning-icon>
                    </div>
                    <div
                        class="backlog-cell backlog-cell--name"
                    >
                        Name
                    </div>
                    <div
                        class="backlog-cell backlog-cell--subject"
                    >
                        Subject
                    </div>
                    <div
                        class="backlog-cell backlog-cell--status"
                    >
                        Status
                    </div>
                    <div
                        class="backlog-cell backlog-cell--type"
                    >
                        Type
                    </div>
                    <div
                        class="backlog-cell backlog-cell--priority"
                    >
                        Priority
                    </div>
                    <div
                        class="backlog-cell backlog-cell--points"
                    >
                        Points
                    </div>
                    <div
                        class="backlog-cell backlog-cell--assignee"
                    >
                        Assignee
                    </div>
                    <template lwc:if={showDebugInfo}>
                        <div
                            class="backlog-cell backlog-cell--debug"
                        >
                            LexoRank
                        </div>
                    </template>
                </div>

                <!-- Sections (sprint sections + ungrouped) -->
                <template
                    for:each={backlogSections}
                    for:item="section"
                >
                    <div
                        key={section.key}
                        class="backlog-section"
                    >
                        <!-- Sprint Section Header -->
                        <template
                            lwc:if={section.isSprintSection}
                        >
                            <div
                                class="sprint-header-row slds-grid slds-grid_vertical-align-center"
                                data-sprint-id={section.sprintId}
                                onclick={handleSprintHeaderClick}
                                oncontextmenu={handleSprintContextMenu}
                                ondragover={handleSectionHeaderDragOver}
                                ondragleave={handleSectionHeaderDragLeave}
                                ondrop={handleSectionHeaderDrop}
                            >
                                <div
                                    class="sprint-header__chevron"
                                >
                                    <lightning-icon
                                        icon-name={section.chevronIcon}
                                        size="xx-small"
                                        alternative-text="Toggle"
                                    ></lightning-icon>
                                </div>
                                <div
                                    class="sprint-header__label"
                                >
                                    <strong
                                        >{section.sprintLabel}</strong
                                    >
                                    <template
                                        lwc:if={section.hasGoal}
                                    >
                                        <span
                                            class="sprint-header__goal"
                                        >
                                            &mdash;
                                            {section.goal}</span
                                        >
                                    </template>
                                </div>
                                <div
                                    class="sprint-header__stats slds-text-body_small"
                                >
                                    {section.cardCount}
                                    cards &bull;
                                    {section.totalPoints}
                                    pts
                                </div>
                                <template
                                    lwc:if={section.isActiveSprintSection}
                                >
                                    <span class="sprint-status-badge sprint-status-badge--active">Active</span>
                                    <div class="sprint-header__actions" onclick={handleSprintActionClick}>
                                        <button
                                            class="sprint-action-btn sprint-action-btn--complete"
                                            data-sprint-id={section.sprintId}
                                            onclick={handleCompleteActiveSprint}
                                            title="Complete Sprint"
                                        >
                                            Complete Sprint
                                        </button>
                                    </div>
                                </template>
                                <template
                                    lwc:if={section.isPlanningSprintSection}
                                >
                                    <span class="sprint-status-badge sprint-status-badge--planning">Planning</span>
                                    <div class="sprint-header__actions" onclick={handleSprintActionClick}>
                                        <template lwc:if={section.canStartSprint}>
                                            <button
                                                class="sprint-action-btn sprint-action-btn--start"
                                                data-sprint-id={section.sprintId}
                                                onclick={handleStartSprint}
                                                title="Start Sprint"
                                            >
                                                Start Sprint
                                            </button>
                                        </template>
                                        <template lwc:if={section.isConfirmingDelete}>
                                            <span class="sprint-delete-confirm-label">Delete sprint?</span>
                                            <button
                                                class="sprint-action-btn sprint-action-btn--delete-confirm"
                                                onclick={handleConfirmDeleteSprint}
                                                title="Confirm delete"
                                            >
                                                Yes, delete
                                            </button>
                                            <button
                                                class="sprint-action-btn sprint-action-btn--cancel"
                                                onclick={handleCancelDeleteSprint}
                                                title="Cancel"
                                            >
                                                Cancel
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <button
                                                class="sprint-action-btn sprint-action-btn--delete"
                                                data-sprint-id={section.sprintId}
                                                onclick={handleDeleteSprint}
                                                title="Delete Sprint"
                                            >
                                                <lightning-icon
                                                    icon-name="utility:delete"
                                                    size="xx-small"
                                                    alternative-text="Delete"
                                                ></lightning-icon>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Backlog Section Header -->
                        <template
                            lwc:if={section.isBacklogSection}
                        >
                            <div
                                class="sprint-header-row backlog-header-row slds-grid slds-grid_vertical-align-center"
                                data-sprint-id="ungrouped"
                                onclick={handleSprintHeaderClick}
                                ondragover={handleSectionHeaderDragOver}
                                ondragleave={handleSectionHeaderDragLeave}
                                ondrop={handleSectionHeaderDrop}
                            >
                                <div
                                    class="sprint-header__chevron"
                                >
                                    <lightning-icon
                                        icon-name={section.chevronIcon}
                                        size="xx-small"
                                        alternative-text="Toggle"
                                    ></lightning-icon>
                                </div>
                                <div
                                    class="sprint-header__label"
                                >
                                    <strong>Backlog</strong>
                                </div>
                                <div
                                    class="sprint-header__stats slds-text-body_small"
                                >
                                    {section.cardCount}
                                    cards &bull;
                                    {section.totalPoints}
                                    pts
                                </div>
                            </div>
                        </template>

                        <!-- Cards in section -->
                        <template
                            lwc:if={section.isExpanded}
                        >
                            <template
                                for:each={section.cards}
                                for:item="card"
                            >
                                <div
                                    key={card.Id}
                                    class="backlog-row slds-grid slds-grid_vertical-align-center"
                                    data-card-id={card.Id}
                                    data-index={card.__index}
                                    data-sprint-id={card.__sprintId}
                                    style={card.rowStyle}
                                    draggable="true"
                                    ondragstart={handleDragStart}
                                    ondragover={handleDragOver}
                                    ondragend={handleDragEnd}
                                    ondrop={handleDrop}
                                    onclick={handleRowClick}
                                    oncontextmenu={handleContextMenu}
                                >
                                    <!-- Drag Handle -->
                                    <div
                                        class="backlog-cell backlog-cell--drag"
                                    >
                                        <lightning-icon
                                            icon-name="utility:drag_and_drop"
                                            size="xx-small"
                                            alternative-text="Drag"
                                        ></lightning-icon>
                                    </div>

                                    <!-- Checkbox -->
                                    <div
                                        class="backlog-cell backlog-cell--checkbox"
                                    >
                                        <lightning-input
                                            type="checkbox"
                                            data-card-id={card.Id}
                                            checked={card.isSelected}
                                            onchange={handleCardSelect}
                                            variant="label-hidden"
                                            label="Select"
                                        ></lightning-input>
                                    </div>

                                    <!-- Refinement Toggle -->
                                    <div
                                        class="backlog-cell backlog-cell--refinement"
                                    >
                                        <button
                                            class="refinement-toggle slds-button slds-button_icon slds-button_icon-x-small"
                                            data-card-id={card.Id}
                                            onclick={handleRefinementToggle}
                                            title="Toggle Refinement"
                                        >
                                            <lightning-icon
                                                icon-name={card.refinementIcon}
                                                size="xx-small"
                                                alternative-text="Refinement"
                                                class={card.refinementClass}
                                            ></lightning-icon>
                                        </button>
                                    </div>

                                    <!-- Name -->
                                    <div
                                        class="backlog-cell backlog-cell--name"
                                    >
                                        <a
                                            href={card.recordUrl}
                                            data-card-id={card.Id}
                                            onclick={handleCardNameClick}
                                            onauxclick={handleCardNameMiddleClick}
                                            class="slds-text-link"
                                            >{card.Name}</a
                                        >
                                    </div>

                                    <!-- Subject -->
                                    <div
                                        class="backlog-cell backlog-cell--subject slds-truncate"
                                        title={card.subject}
                                    >
                                        {card.subject}
                                    </div>

                                    <!-- Status -->
                                    <div
                                        class="backlog-cell backlog-cell--status slds-truncate"
                                        title={card.statusLabel}
                                    >
                                        <template lwc:if={card.statusLabel}>
                                            <span class={card.statusBadgeClass}>{card.statusLabel}</span>
                                        </template>
                                    </div>

                                    <!-- Type -->
                                    <div
                                        class="backlog-cell backlog-cell--type"
                                    >
                                        <template
                                            lwc:if={card.cardType}
                                        >
                                            <span
                                                class="slds-badge slds-badge_inverse"
                                                >{card.cardType}</span
                                            >
                                        </template>
                                    </div>

                                    <!-- Priority -->
                                    <div
                                        class="backlog-cell backlog-cell--priority"
                                    >
                                        <template
                                            lwc:if={card.priority}
                                        >
                                            <span
                                                class={card.priorityBadgeClass}
                                                >{card.priority}</span
                                            >
                                        </template>
                                    </div>

                                    <!-- Points -->
                                    <div
                                        class="backlog-cell backlog-cell--points"
                                    >
                                        {card.storyPoints}
                                    </div>

                                    <!-- Assignee -->
                                    <div
                                        class="backlog-cell backlog-cell--assignee slds-truncate"
                                    >
                                        <template
                                            lwc:if={card.assignee}
                                        >
                                            {card.assignee.name}
                                        </template>
                                    </div>

                                    <!-- Debug: LexoRank -->
                                    <template
                                        lwc:if={showDebugInfo}
                                    >
                                        <div
                                            class="backlog-cell backlog-cell--debug slds-truncate"
                                            title={card.position}
                                        >
                                            <template
                                                lwc:if={card.position}
                                            >
                                                {card.position}
                                            </template>
                                            <template
                                                lwc:else
                                            >
                                                <em
                                                    >null</em
                                                >
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>
                    </div>
                </template>
            </template>

            <!-- Empty State -->
            <template lwc:if={showEmptyState}>
                <div
                    class="slds-align_absolute-center slds-var-p-around_large"
                    style="min-height: 300px"
                >
                    <div class="slds-text-align_center">
                        <lightning-icon
                            icon-name="standard:task2"
                            size="large"
                            class="slds-var-m-bottom_medium"
                        ></lightning-icon>
                        <h3
                            class="slds-text-heading_medium slds-var-m-bottom_small"
                        >
                            No backlog cards
                        </h3>
                        <p
                            class="slds-text-body_regular slds-text-color_weak slds-var-m-bottom_medium"
                        >
                            Create your first backlog card
                            to start planning
                        </p>
                        <lightning-button
                            label="Create Card"
                            icon-name="utility:add"
                            onclick={handleToggleCreateForm}
                            variant="brand"
                        ></lightning-button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Context Menu -->
        <c-kanban-context-menu
            menu-items={contextMenuItems}
            onselect={handleContextMenuSelect}
        ></c-kanban-context-menu>
    </div>
</template>
