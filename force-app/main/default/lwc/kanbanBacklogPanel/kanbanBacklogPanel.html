<template>
    <div class={panelClass}>
        <!-- Panel Header -->
        <div
            class="backlog-panel__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-p-around_small"
        >
            <div
                class="slds-grid slds-grid_vertical-align-center"
            >
                <lightning-icon
                    icon-name="standard:task2"
                    size="small"
                    class="slds-var-m-right_x-small"
                ></lightning-icon>
                <h2
                    class="slds-text-heading_small slds-truncate"
                >
                    Backlog
                    <span
                        class="slds-badge slds-var-m-left_xx-small"
                        >{cardCount}</span
                    >
                </h2>
            </div>
            <button
                class="slds-button slds-button_icon slds-button_icon-small"
                title="Close Backlog"
                onclick={handleClose}
            >
                <lightning-icon
                    icon-name="utility:close"
                    size="xx-small"
                    alternative-text="Close"
                ></lightning-icon>
            </button>
        </div>

        <!-- Search and Sort -->
        <div
            class="backlog-panel__toolbar slds-var-p-horizontal_small slds-var-p-bottom_small"
        >
            <div
                class="slds-form-element slds-var-m-bottom_x-small"
            >
                <div
                    class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left"
                >
                    <lightning-icon
                        icon-name="utility:search"
                        size="xx-small"
                        class="slds-input__icon slds-input__icon_left"
                    ></lightning-icon>
                    <lightning-input
                        type="search"
                        placeholder="Search backlog..."
                        value={searchTerm}
                        onchange={handleSearchChange}
                        variant="label-hidden"
                        class="backlog-search"
                    ></lightning-input>
                </div>
            </div>
            <lightning-combobox
                label="Sort by"
                value={sortBy}
                options={sortOptions}
                onchange={handleSortChange}
                variant="label-hidden"
                class="backlog-sort"
            ></lightning-combobox>
        </div>

        <!-- Bulk Actions -->
        <template lwc:if={hasSelectedCards}>
            <div
                class="backlog-panel__actions slds-var-p-horizontal_small slds-var-p-bottom_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
            >
                <span class="slds-text-body_small"
                    >{selectedCount} selected</span
                >
                <div
                    class="slds-grid slds-gutters_xx-small"
                >
                    <button
                        class="slds-button slds-button_neutral slds-button_small"
                        onclick={handleDeselectAll}
                    >
                        Clear
                    </button>
                    <template lwc:if={hasActiveSprint}>
                        <button
                            class="slds-button slds-button_brand slds-button_small"
                            onclick={handleAddToSprint}
                        >
                            {addToSprintLabel}
                        </button>
                    </template>
                </div>
            </div>
        </template>

        <!-- Card List -->
        <div class="backlog-panel__cards slds-scrollable_y">
            <template lwc:if={hasCards}>
                <template
                    for:each={backlogCards}
                    for:item="card"
                >
                    <div
                        key={card.Id}
                        class="backlog-card slds-box slds-box_xx-small slds-var-m-horizontal_small slds-var-m-bottom_xx-small"
                        data-card-id={card.Id}
                        draggable="true"
                        ondragstart={handleDragStart}
                        ondragend={handleDragEnd}
                    >
                        <div
                            class="slds-grid slds-grid_vertical-align-center"
                        >
                            <!-- Checkbox -->
                            <div
                                class="slds-var-m-right_x-small"
                            >
                                <lightning-input
                                    type="checkbox"
                                    data-card-id={card.Id}
                                    checked={card.isSelected}
                                    onchange={handleCardSelect}
                                    variant="label-hidden"
                                    label="Select"
                                ></lightning-input>
                            </div>

                            <!-- Card Info -->
                            <div
                                class="slds-col slds-has-flexi-truncate"
                                onclick={handleCardClick}
                                data-card-id={card.Id}
                            >
                                <p
                                    class="slds-text-body_small slds-truncate"
                                >
                                    <strong
                                        >{card.Name}</strong
                                    >
                                </p>
                                <p
                                    class="slds-text-body_small slds-truncate slds-text-color_weak"
                                >
                                    {card.subject}
                                </p>
                            </div>

                            <!-- Story Points -->
                            <template
                                lwc:if={card.hasStoryPoints}
                            >
                                <div
                                    class="slds-var-m-left_x-small"
                                >
                                    <span class="slds-badge"
                                        >{card.storyPoints}</span
                                    >
                                </div>
                            </template>
                        </div>

                        <!-- Card metadata row -->
                        <div
                            class="slds-grid slds-grid_vertical-align-center slds-var-m-top_xxx-small"
                        >
                            <template
                                lwc:if={card.cardType}
                            >
                                <span
                                    class="slds-text-body_small slds-text-color_weak slds-var-m-right_xx-small"
                                    >{card.cardType}</span
                                >
                            </template>
                            <template
                                lwc:if={card.priority}
                            >
                                <span
                                    class="slds-badge slds-badge_inverse slds-text-body_small"
                                    >{card.priority}</span
                                >
                            </template>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Empty State -->
            <template lwc:else>
                <div
                    class="slds-text-align_center slds-var-p-around_medium slds-text-color_weak"
                >
                    <lightning-icon
                        icon-name="utility:check"
                        size="small"
                        class="slds-var-m-bottom_small"
                    ></lightning-icon>
                    <p class="slds-text-body_small">
                        No backlog cards
                    </p>
                </div>
            </template>
        </div>
    </div>
</template>
