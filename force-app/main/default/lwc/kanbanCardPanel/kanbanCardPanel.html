<template>
    <template lwc:if={isOpen}>
        <div
            class="card-panel"
            style={panelStyle}
            onkeydown={handleKeyDown}
            tabindex="-1"
        >
            <!-- Resize Handle -->
            <div
                class="card-panel__resize-handle"
                onmousedown={handleResizeStart}
            ></div>

            <!-- Panel Header -->
            <div
                class="card-panel__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-p-around_small"
            >
                <div
                    class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate"
                >
                    <lightning-icon
                        icon-name="standard:task"
                        size="small"
                        class="slds-var-m-right_x-small"
                    ></lightning-icon>
                    <h2
                        class="slds-text-heading_small slds-truncate"
                    >
                        <a
                            href={cardRecordUrl}
                            data-card-id={card.Id}
                            onclick={handleNameClick}
                            class="slds-text-link"
                            >{card.Name}</a
                        >
                    </h2>
                </div>
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    variant="bare"
                    size="small"
                    onclick={handleClose}
                ></lightning-button-icon>
            </div>

            <!-- Panel Body - scrollable -->
            <div
                class="card-panel__body slds-var-p-around_small"
            >
                <lightning-record-edit-form
                    object-api-name="OpenSF__Card__c"
                    record-id={card.Id}
                >
                    <div
                        class="slds-form slds-form_stacked"
                    >
                        <div
                            class="slds-grid slds-wrap slds-gutters_small"
                        >
                            <template
                                for:each={regularFields}
                                for:item="field"
                            >
                                <div
                                    key={field.key}
                                    class={field.columnClass}
                                >
                                    <lightning-input-field
                                        field-name={field.fieldName}
                                        variant="label-stacked"
                                    ></lightning-input-field>
                                </div>
                            </template>
                            <template
                                lwc:if={descriptionField}
                            >
                                <div
                                    class="slds-col slds-size_1-of-1 slds-var-m-top_small"
                                >
                                    <div
                                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end slds-var-m-bottom_xx-small"
                                    >
                                        <span
                                            class="slds-form-element__label"
                                            >Description</span
                                        >
                                        <template
                                            lwc:if={showApplyTemplate}
                                        >
                                            <lightning-button
                                                variant="base"
                                                label="Apply Template"
                                                icon-name="utility:paste"
                                                onclick={handleApplyTemplate}
                                                class="template-btn"
                                            ></lightning-button>
                                        </template>
                                    </div>
                                    <lightning-input-field
                                        field-name={descriptionField.fieldName}
                                        variant="label-hidden"
                                    ></lightning-input-field>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-record-edit-form>

                <!-- Epic Detail Section (only for Epic-type cards) -->
                <template lwc:if={isEpicCard}>
                    <div
                        class="epic-detail-section slds-var-m-top_small"
                    >
                        <h3
                            class="slds-text-heading_small slds-var-m-bottom_x-small"
                        >
                            <lightning-icon
                                icon-name="utility:layers"
                                size="xx-small"
                                class="slds-var-m-right_xx-small"
                            ></lightning-icon>
                            Epic Progress
                        </h3>

                        <template
                            lwc:if={epicDetailLoading}
                        >
                            <lightning-spinner
                                alternative-text="Loading epic details"
                                size="small"
                            ></lightning-spinner>
                        </template>

                        <template lwc:if={epicDetail}>
                            <!-- Progress Bar -->
                            <div
                                class="epic-detail__progress slds-var-m-bottom_x-small"
                            >
                                <div
                                    class="epic-detail__progress-bar"
                                >
                                    <div
                                        class="epic-detail__progress-fill"
                                        style={epicProgressStyle}
                                    ></div>
                                </div>
                                <div
                                    class="slds-grid slds-grid_align-spread slds-var-m-top_xxx-small"
                                >
                                    <span
                                        class="slds-text-body_small"
                                        >{epicProgressLabel}</span
                                    >
                                    <span
                                        class="slds-text-body_small"
                                        >{epicPointsLabel}</span
                                    >
                                </div>
                            </div>

                            <!-- Child Cards List -->
                            <template
                                lwc:if={hasEpicChildCards}
                            >
                                <div
                                    class="epic-detail__children"
                                >
                                    <template
                                        for:each={epicDetail.childCards}
                                        for:item="child"
                                    >
                                        <div
                                            key={child.id}
                                            class="epic-child-card"
                                            data-card-id={child.id}
                                            onclick={handleChildCardClick}
                                        >
                                            <div
                                                class="epic-child-card__header"
                                            >
                                                <span
                                                    class="epic-child-card__name slds-truncate"
                                                    >{child.name}</span
                                                >
                                                <template
                                                    lwc:if={child.storyPoints}
                                                >
                                                    <span
                                                        class="epic-child-card__sp"
                                                        >{child.storyPoints}</span
                                                    >
                                                </template>
                                            </div>
                                            <div
                                                class="epic-child-card__meta"
                                            >
                                                <span
                                                    class="epic-child-card__subject slds-truncate"
                                                    >{child.subject}</span
                                                >
                                            </div>
                                            <div
                                                class="epic-child-card__badges"
                                            >
                                                <template
                                                    lwc:if={child.status}
                                                >
                                                    <span
                                                        class="epic-child-badge"
                                                        >{child.status}</span
                                                    >
                                                </template>
                                                <template
                                                    lwc:if={child.cardType}
                                                >
                                                    <span
                                                        class="epic-child-badge"
                                                        >{child.cardType}</span
                                                    >
                                                </template>
                                                <template
                                                    lwc:if={child.assigneeName}
                                                >
                                                    <span
                                                        class="epic-child-badge"
                                                        >{child.assigneeName}</span
                                                    >
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template lwc:else>
                                <p
                                    class="slds-text-body_small slds-text-color_weak"
                                >
                                    No child cards linked to
                                    this epic yet.
                                </p>
                            </template>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Panel Footer -->
            <div
                class="card-panel__footer slds-grid slds-grid_align-spread slds-var-p-around_small"
            >
                <lightning-button
                    variant={deleteButtonVariant}
                    label={deleteButtonLabel}
                    onclick={handleDelete}
                    icon-name="utility:delete"
                ></lightning-button>
                <div>
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleClose}
                        class="slds-var-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={handleSave}
                        icon-name="utility:save"
                    ></lightning-button>
                </div>
            </div>
        </div>
    </template>
</template>
