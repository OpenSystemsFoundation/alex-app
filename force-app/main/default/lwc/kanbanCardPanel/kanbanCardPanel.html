<template>
    <template lwc:if={isOpen}>
        <div
            class="card-panel"
            style={panelStyle}
            onkeydown={handleKeyDown}
            tabindex="-1"
        >
            <!-- Resize Handle -->
            <div
                class="card-panel__resize-handle"
                onmousedown={handleResizeStart}
            ></div>

            <!-- Panel Header -->
            <div
                class="card-panel__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-p-around_small"
            >
                <div
                    class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate"
                >
                    <lightning-icon
                        icon-name="standard:task"
                        size="small"
                        class="slds-var-m-right_x-small"
                    ></lightning-icon>
                    <h2
                        class="slds-text-heading_small slds-truncate"
                    >
                        <a
                            href={cardRecordUrl}
                            data-card-id={card.Id}
                            onclick={handleNameClick}
                            class="slds-text-link"
                            >{card.Name}</a
                        >
                    </h2>
                </div>
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    variant="bare"
                    size="small"
                    onclick={handleClose}
                ></lightning-button-icon>
            </div>

            <!-- Panel Body - scrollable -->
            <div
                class="card-panel__body slds-var-p-around_small"
            >
                <lightning-record-edit-form
                    object-api-name="OpenSF__Card__c"
                    record-id={card.Id}
                >
                    <div
                        class="slds-form slds-form_stacked"
                    >
                        <div
                            class="slds-grid slds-wrap slds-gutters_small"
                        >
                            <template
                                for:each={regularFields}
                                for:item="field"
                            >
                                <div
                                    key={field.key}
                                    class={field.columnClass}
                                >
                                    <lightning-input-field
                                        field-name={field.fieldName}
                                        variant="label-stacked"
                                    ></lightning-input-field>
                                </div>
                            </template>
                            <template
                                lwc:if={descriptionField}
                            >
                                <div
                                    class="slds-col slds-size_1-of-1 slds-var-m-top_small"
                                >
                                    <div
                                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end slds-var-m-bottom_xx-small"
                                    >
                                        <span
                                            class="slds-form-element__label"
                                            >Description</span
                                        >
                                        <template
                                            lwc:if={showApplyTemplate}
                                        >
                                            <lightning-button
                                                variant="base"
                                                label="Apply Template"
                                                icon-name="utility:paste"
                                                onclick={handleApplyTemplate}
                                                class="template-btn"
                                            ></lightning-button>
                                        </template>
                                    </div>
                                    <lightning-input-field
                                        field-name={descriptionField.fieldName}
                                        variant="label-hidden"
                                    ></lightning-input-field>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-record-edit-form>

                <!-- Files Section -->
                <div class="card-panel__files slds-var-m-top_medium">
                    <div
                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-bottom_x-small"
                    >
                        <h3
                            class="slds-text-title_caps slds-text-color_weak"
                        >
                            Files
                            <template lwc:if={fileCount}>
                                ({fileCount})
                            </template>
                        </h3>
                        <button
                            class="slds-button slds-button_icon slds-button_icon-border-filled"
                            title="Toggle files section"
                            onclick={toggleFilesSection}
                        >
                            <lightning-icon
                                icon-name={filesToggleIcon}
                                size="xx-small"
                                alternative-text="Toggle"
                            ></lightning-icon>
                        </button>
                    </div>
                    <template lwc:if={filesExpanded}>
                        <lightning-file-upload
                            label="Upload Files"
                            name="fileUploader"
                            accept={acceptedFormats}
                            record-id={card.Id}
                            onuploadfinished={handleUploadFinished}
                            multiple
                        ></lightning-file-upload>
                        <template lwc:if={hasFiles}>
                            <ul class="slds-has-dividers_bottom-space slds-var-m-top_small">
                                <template
                                    for:each={files}
                                    for:item="file"
                                >
                                    <li
                                        key={file.contentDocumentId}
                                        class="slds-item card-file-item"
                                    >
                                        <div
                                            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                                        >
                                            <div
                                                class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate"
                                            >
                                                <lightning-icon
                                                    icon-name={file.iconName}
                                                    size="small"
                                                    class="slds-var-m-right_x-small"
                                                ></lightning-icon>
                                                <div
                                                    class="slds-truncate"
                                                >
                                                    <a
                                                        href={file.downloadUrl}
                                                        target="_blank"
                                                        class="slds-text-link"
                                                        title={file.title}
                                                        >{file.title}.{file.fileExtension}</a
                                                    >
                                                    <p
                                                        class="slds-text-body_small slds-text-color_weak"
                                                    >
                                                        {file.formattedSize}
                                                    </p>
                                                </div>
                                            </div>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Delete file"
                                                variant="bare"
                                                size="small"
                                                data-file-id={file.contentDocumentId}
                                                onclick={handleDeleteFile}
                                            ></lightning-button-icon>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:if={noFiles}>
                            <p
                                class="slds-text-body_small slds-text-color_weak slds-var-m-top_small slds-align_absolute-center"
                            >
                                No files attached
                            </p>
                        </template>
                    </template>
                </div>
            </div>

            <!-- Panel Footer -->
            <div
                class="card-panel__footer slds-grid slds-grid_align-spread slds-var-p-around_small"
            >
                <lightning-button
                    variant={deleteButtonVariant}
                    label={deleteButtonLabel}
                    onclick={handleDelete}
                    icon-name="utility:delete"
                ></lightning-button>
                <div>
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleClose}
                        class="slds-var-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={handleSave}
                        icon-name="utility:save"
                    ></lightning-button>
                </div>
            </div>
        </div>
    </template>
</template>
