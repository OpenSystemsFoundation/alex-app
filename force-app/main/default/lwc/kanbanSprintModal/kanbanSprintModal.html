<template>
    <template lwc:if={isOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="sprint-modal-heading"
            class="slds-modal slds-fade-in-open"
            onkeydown={handleKeyDown}
        >
            <div class="slds-modal__container">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={handleClose}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        size="small"
                        variant="inverse"
                    ></lightning-icon>
                </button>

                <div class="slds-modal__header">
                    <h2
                        id="sprint-modal-heading"
                        class="slds-modal__title slds-hyphenate"
                    >
                        {modalTitle}
                    </h2>
                </div>

                <div
                    class="slds-modal__content slds-var-p-around_medium"
                >
                    <div class="slds-form">
                        <div
                            class="slds-form-element slds-var-m-bottom_small"
                        >
                            <lightning-textarea
                                label="Sprint Goal"
                                value={goal}
                                onchange={handleGoalChange}
                                placeholder="What is the objective for this sprint?"
                                max-length="32768"
                            ></lightning-textarea>
                        </div>

                        <div
                            class="slds-grid slds-gutters_small slds-var-m-bottom_small"
                        >
                            <div
                                class="slds-col slds-size_1-of-2"
                            >
                                <lightning-input
                                    type="date"
                                    label="Start Date"
                                    value={startDate}
                                    onchange={handleStartDateChange}
                                ></lightning-input>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-2"
                            >
                                <lightning-input
                                    type="date"
                                    label="End Date"
                                    value={endDate}
                                    onchange={handleEndDateChange}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="slds-modal__footer">
                    <button
                        class="slds-button slds-button_neutral"
                        onclick={handleClose}
                    >
                        Cancel
                    </button>
                    <template lwc:if={canStart}>
                        <button
                            class="slds-button slds-button_outline-brand"
                            onclick={handleStartSprint}
                            disabled={isProcessing}
                        >
                            Start Sprint
                        </button>
                    </template>
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleSave}
                        disabled={isProcessing}
                    >
                        {saveLabel}
                    </button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
