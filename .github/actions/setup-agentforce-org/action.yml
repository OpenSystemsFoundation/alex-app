name: 'Setup Agentforce Scratch Org'
description: 'Creates or reuses a persistent Agentforce-enabled scratch org, deploys both Alex + Agentforce packages, assigns permsets, and returns a login URL'

inputs:
    org-alias:
        description: 'Alias for the scratch org'
        required: true
    sfdx-auth-url:
        description: 'DevHub SFDX auth URL'
        required: true
    scratch-def:
        description: 'Which Agentforce scratch def to use'
        required: false
        default: 'config/agentforce-project-scratch-def.json'
    create-board-data:
        description: 'Whether to create filled kanban board data'
        required: false
        default: 'true'
    duration-days:
        description: 'Scratch org duration in days'
        required: false
        default: '1'
    deploy-agentforce:
        description: 'Whether to deploy the Agentforce extension package'
        required: false
        default: 'true'
    persistent:
        description: 'Reuse scratch org across runs via cache (true) or create ephemeral org (false)'
        required: false
        default: 'false'
    cache-key:
        description: 'Cache key prefix for persistent orgs (e.g. branch name). Required when persistent=true.'
        required: false
        default: ''

outputs:
    login-url:
        description: 'Salesforce frontdoor login URL'
        value: ${{ steps.login.outputs.url }}
    username:
        description: 'Scratch org username'
        value: ${{ steps.org-info.outputs.username }}
    instance-url:
        description: 'Scratch org instance URL'
        value: ${{ steps.org-info.outputs.instance_url }}
    org-created:
        description: 'Whether a new org was created (true) or an existing one was reused (false)'
        value: ${{ steps.provision.outputs.org_created }}
    error-log:
        description: 'Path to error log file if setup failed'
        value: /tmp/setup-error-${{ inputs.org-alias }}.log

runs:
    using: 'composite'
    steps:
        - name: Install Salesforce CLI
          shell: bash
          run: npm install -g @salesforce/cli

        - name: Authenticate DevHub
          shell: bash
          env:
              SFDX_DISABLE_DNS_CHECK: 'true'
          run: |
              ERROR_LOG="/tmp/setup-error-${{ inputs.org-alias }}.log"
              echo "" > "$ERROR_LOG"
              if [ -z "${{ inputs.sfdx-auth-url }}" ]; then
                echo "SFDX_AUTH_URL is empty — check the repository secret" | tee "$ERROR_LOG"
                exit 1
              fi
              echo "${{ inputs.sfdx-auth-url }}" > /tmp/sfdx_auth_${{ inputs.org-alias }}.txt
              if ! sf org login sfdx-url \
                --sfdx-url-file /tmp/sfdx_auth_${{ inputs.org-alias }}.txt \
                --alias devhub \
                --set-default-dev-hub 2>&1 | tee -a "$ERROR_LOG"; then
                echo "DevHub authentication failed" >> "$ERROR_LOG"
                rm -f /tmp/sfdx_auth_${{ inputs.org-alias }}.txt
                exit 1
              fi
              rm /tmp/sfdx_auth_${{ inputs.org-alias }}.txt

        - name: Restore cached org auth
          if: inputs.persistent == 'true'
          id: cache-restore
          uses: actions/cache/restore@v4
          with:
              path: /tmp/cached-org-auth-${{ inputs.org-alias }}.txt
              key: scratch-org-${{ inputs.cache-key }}-${{ inputs.org-alias }}

        - name: Provision Scratch Org (create or reuse)
          id: provision
          shell: bash
          env:
              SFDX_DISABLE_DNS_CHECK: 'true'
          run: |
              ORG_CREATED="true"
              PERSISTENT="${{ inputs.persistent }}"
              ALIAS="${{ inputs.org-alias }}"
              CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
              AUTH_FILE="/tmp/cached-org-auth-${{ inputs.org-alias }}.txt"

              if [ "$PERSISTENT" = "true" ] && [ "$CACHE_HIT" = "true" ] && [ -f "$AUTH_FILE" ]; then
                echo "::group::Attempting to reuse cached scratch org"
                sf org login sfdx-url \
                  --sfdx-url-file "$AUTH_FILE" \
                  --alias "$ALIAS" 2>/dev/null || true

                if sf org display --target-org "$ALIAS" --json 2>/dev/null | node -e "
                  let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                    const j=JSON.parse(d);
                    const status = (j.result && j.result.connectedStatus) || '';
                    process.exit(status === 'Connected' ? 0 : 1);
                  });
                "; then
                  echo "✅ Cached scratch org is alive — reusing"
                  ORG_CREATED="false"
                else
                  echo "⚠️ Cached org is dead or expired — will create a new one"
                  rm -f "$AUTH_FILE"
                fi
                echo "::endgroup::"
              fi

              if [ "$ORG_CREATED" = "true" ]; then
                echo "::group::Creating new scratch org"
                ERROR_LOG="/tmp/setup-error-${{ inputs.org-alias }}.log"
                set -o pipefail
                if ! sf org create scratch \
                  --definition-file ${{ inputs.scratch-def }} \
                  --alias "$ALIAS" \
                  --duration-days ${{ inputs.duration-days }} \
                  --wait 15 2>&1 | tee -a "$ERROR_LOG"; then
                  echo "Scratch org creation failed for alias=$ALIAS def=${{ inputs.scratch-def }}" >> "$ERROR_LOG"
                  exit 1
                fi
                set +o pipefail

                if [ "$PERSISTENT" = "true" ]; then
                  sf org display --target-org "$ALIAS" --verbose --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      const j=JSON.parse(d);
                      console.log(j.result.sfdxAuthUrl);
                    });
                  " > "$AUTH_FILE"
                fi
                echo "::endgroup::"
              fi

              echo "org_created=$ORG_CREATED" >> "$GITHUB_OUTPUT"

        - name: Save org auth to cache
          if: inputs.persistent == 'true' && steps.provision.outputs.org_created == 'true'
          uses: actions/cache/save@v4
          with:
              path: /tmp/cached-org-auth-${{ inputs.org-alias }}.txt
              key: scratch-org-${{ inputs.cache-key }}-${{ inputs.org-alias }}

        - name: Prepare Project Config for Source Deploy
          shell: bash
          run: |
              node -e "
                const p = require('./sfdx-project.json');
                p.packageDirectories.forEach(d => { delete d.dependencies; });
                require('fs').writeFileSync('sfdx-project.json', JSON.stringify(p, null, 4));
              "

        - name: Deploy Base Package (force-app)
          shell: bash
          run: |
              ERROR_LOG="/tmp/setup-error-${{ inputs.org-alias }}.log"
              sf project deploy start --source-dir force-app --target-org ${{ inputs.org-alias }} --ignore-conflicts --json 2>&1 | tee /tmp/deploy-base.json || true
              node -e "
                const raw = require('fs').readFileSync('/tmp/deploy-base.json', 'utf8');
                const idx = raw.indexOf('{');
                if (idx < 0) { console.log(raw); require('fs').appendFileSync('$ERROR_LOG', 'Deploy base: no JSON in output\n' + raw); process.exit(1); }
                const j = JSON.parse(raw.substring(idx));
                if (j.status !== 0) {
                  const msg = 'Deploy base failed: ' + (j.message || 'unknown');
                  const files = (j.result && j.result.details && j.result.details.componentFailures) || [];
                  const details = files.map(f => '  - ' + f.fullName + ': ' + f.problem).join('\n');
                  const full = msg + '\n' + details;
                  console.error(full);
                  require('fs').appendFileSync('$ERROR_LOG', full + '\n');
                  process.exit(1);
                }
                console.log('Deploy succeeded:', (j.result && j.result.numberComponentsDeployed) || '?', 'components');
              "

        - name: Deploy Agentforce Package (force-agentforce)
          if: inputs.deploy-agentforce == 'true'
          shell: bash
          run: sf project deploy start --source-dir force-agentforce --target-org ${{ inputs.org-alias }} --ignore-conflicts

        - name: Assign Permission Sets
          if: steps.provision.outputs.org_created == 'true'
          shell: bash
          run: |
              sf org assign permset --name Alex_Admin --target-org ${{ inputs.org-alias }}
              if [ "${{ inputs.deploy-agentforce }}" = "true" ]; then
                sf org assign permset --name Alex_Agentforce_User --target-org ${{ inputs.org-alias }} || true
              fi

        - name: Create Board Data
          if: inputs.create-board-data == 'true' && steps.provision.outputs.org_created == 'true'
          shell: bash
          run: sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org ${{ inputs.org-alias }}

        - name: Get Org Info
          id: org-info
          shell: bash
          run: |
              ORG_INFO=$(sf org display --target-org ${{ inputs.org-alias }} --json 2>&1 || true)
              USERNAME=$(echo "$ORG_INFO" | node -e "
                let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                  try{const j=JSON.parse(d);console.log(j.result.username||'unknown')}
                  catch(e){console.log('unknown')}
                });
              ")
              INSTANCE=$(echo "$ORG_INFO" | node -e "
                let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                  try{const j=JSON.parse(d);console.log(j.result.instanceUrl||'unknown')}
                  catch(e){console.log('unknown')}
                });
              ")
              echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
              echo "instance_url=$INSTANCE" >> "$GITHUB_OUTPUT"

        - name: Get Login URL
          id: login
          shell: bash
          run: |
              LOGIN_URL=$(sf org open --target-org ${{ inputs.org-alias }} --json 2>/dev/null | node -e "
                let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                  const j=JSON.parse(d);
                  console.log(j.result.url);
                });
              ")
              echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"
