# Static analysis only — no scratch orgs, no secrets, no org-based tests.
# Org work (Apex tests, E2E, packaging, promotion) runs locally via the
# global `salesforce-isv` Claude Code skill. See AGENTS.md → CI/CD.

name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    static:
        name: Format, lint, type-check, Jest
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci --no-audit --no-fund

            - name: Prettier
              run: npm run prettier:verify

            - name: ESLint
              run: npm run lint

            - name: E2E TypeScript type-check
              run: npm run type-check:e2e

            # Coverage is reported locally (npm run test:unit:coverage); the 80%
            # threshold in jest.config.js is not met yet, so CI gates on test results only.
            - name: LWC Jest
              run: npm run test:unit -- --silent

            - name: npm audit (production deps, report only)
              if: always()
              run: npm audit --omit=dev || true

    # Pull requests: scan only the force-app files the PR changes.
    # Manual runs (workflow_dispatch): scan all of force-app.
    code-analyzer:
        name: Salesforce Code Analyzer
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Select files to scan
              id: targets
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- force-app > targets.txt
                  else
                    echo force-app > targets.txt
                  fi
                  echo "Files to scan: $(wc -l < targets.txt)"
                  if [ -s targets.txt ]; then
                    echo "scan=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "No force-app changes in this PR; skipping Code Analyzer."
                    echo "scan=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-node@v4
              if: steps.targets.outputs.scan == 'true'
              with:
                  node-version: 22

            - name: Install Salesforce CLI + Code Analyzer
              if: steps.targets.outputs.scan == 'true'
              run: |
                  npm install -g @salesforce/cli
                  sf plugins install code-analyzer

            # Gate: AppExchange rules must have no severity 1-2 findings.
            # Lower-severity findings are listed in the uploaded report.
            - name: AppExchange rules (gate)
              if: steps.targets.outputs.scan == 'true'
              run: |
                  mkdir -p scan-results
                  mapfile -t FILES < targets.txt
                  TARGETS=(); for f in "${FILES[@]}"; do TARGETS+=(--target "$f"); done
                  sf code-analyzer run                     --rule-selector AppExchange                     --workspace force-app                     "${TARGETS[@]}"                     --output-file scan-results/appexchange.json                     --output-file scan-results/appexchange.html                     --severity-threshold 2

            - name: Recommended security rules (report only)
              if: always() && steps.targets.outputs.scan == 'true'
              run: |
                  mapfile -t FILES < targets.txt
                  TARGETS=(); for f in "${FILES[@]}"; do TARGETS+=(--target "$f"); done
                  sf code-analyzer run                     --rule-selector Recommended:Security                     --workspace force-app                     "${TARGETS[@]}"                     --output-file scan-results/recommended-security.json                     --output-file scan-results/recommended-security.html || true

            - uses: actions/upload-artifact@v4
              if: always() && steps.targets.outputs.scan == 'true'
              with:
                  name: code-analyzer
                  path: scan-results/
                  retention-days: 7
