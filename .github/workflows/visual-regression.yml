name: Visual Regression

on:
    pull_request:
        branches: [main]
        paths:
            - 'force-app/main/default/lwc/**/*.html'
            - 'force-app/main/default/lwc/**/*.css'
            - 'e2e/**'
    workflow_dispatch:

jobs:
    visual:
        name: Visual Regression Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright
              run: npx playwright install --with-deps chromium

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-test \
                    --duration-days 1 \
                    --wait 10

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-test --ignore-conflicts

            - name: Assign Permission Sets
              run: sf org assign permset --name Alex_Admin --target-org e2e-test

            - name: Create Test Data
              run: sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-test

            - name: Get Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org e2e-test --url-only --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      console.log(JSON.parse(d).result.url);
                    });
                  ")
                  echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

            # Generate baselines from main branch first
            - name: Checkout main for baselines
              run: |
                  git fetch origin main
                  git checkout origin/main -- e2e/ playwright.config.js || true

            - name: Generate baselines from main
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
              run: |
                  npx playwright test --project=chromium \
                    --grep="Visual Regression" \
                    --update-snapshots \
                    --retries=0 || true

            # Switch back to PR branch and compare
            - name: Checkout PR branch
              run: |
                  git checkout -- e2e/ playwright.config.js

            - name: Compare PR against baselines
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
              run: |
                  npx playwright test --project=chromium \
                    --grep="Visual Regression" \
                    --retries=0

            - name: Upload Visual Diff Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: visual-regression-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-test --no-prompt || true
