name: Apex Performance Benchmark

on:
    workflow_dispatch:
        inputs:
            test_class:
                description: "Test class to run (default: PerformanceBenchmarkTest)"
                required: false
                default: "PerformanceBenchmarkTest"
            scratch_org_duration:
                description: "Scratch org duration in days"
                required: false
                default: "1"

jobs:
    apex-benchmark:
        name: Apex Governor Limit Benchmark
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: sf org create scratch --definition-file config/project-scratch-def.json --alias bench-org --duration-days ${{ github.event.inputs.scratch_org_duration }} --wait 10

            - name: Prepare Project Config
              run: |
                  node -e "
                    const p = require('./sfdx-project.json');
                    p.packageDirectories = p.packageDirectories.filter(d => d.default);
                    p.packageDirectories.forEach(d => { delete d.dependencies; });
                    require('fs').writeFileSync('sfdx-project.json', JSON.stringify(p, null, 4));
                  "

            - name: Deploy Source
              run: sf project deploy start --target-org bench-org --ignore-conflicts

            - name: Assign Permission Set
              run: sf org assign permset --name Alex_Admin --target-org bench-org

            - name: Run Benchmark Tests
              run: |
                  mkdir -p benchmark-results
                  sf apex run test \
                    --target-org bench-org \
                    --tests ${{ github.event.inputs.test_class }} \
                    --result-format json \
                    --code-coverage \
                    --wait 15 > benchmark-results/raw-output.json 2>&1 || true

            - name: Extract Debug Logs with Benchmark Data
              run: |
                  # Get the test run ID from results
                  TEST_RUN_ID=$(node -e "
                    const raw = require('fs').readFileSync('benchmark-results/raw-output.json','utf8');
                    const idx = raw.indexOf('{');
                    if (idx < 0) { console.log(''); process.exit(0); }
                    const j = JSON.parse(raw.substring(idx));
                    console.log(j.result?.summary?.testRunId || '');
                  ")

                  if [ -z "$TEST_RUN_ID" ]; then
                    echo "Could not find test run ID, fetching logs directly..."
                  fi

                  # Query debug logs for the benchmark test
                  sf apex get log --target-org bench-org --number 5 > benchmark-results/debug-logs.txt 2>&1 || true

            - name: Parse Benchmark Results
              run: |
                  node -e "
                    const fs = require('fs');

                    // Parse raw test results
                    const rawOutput = fs.readFileSync('benchmark-results/raw-output.json', 'utf8');
                    const jsonIdx = rawOutput.indexOf('{');
                    let testResults = {};
                    if (jsonIdx >= 0) {
                      testResults = JSON.parse(rawOutput.substring(jsonIdx));
                    }

                    const tests = testResults.result?.tests || [];

                    // Parse debug logs for BENCHMARK lines
                    let debugLog = '';
                    try { debugLog = fs.readFileSync('benchmark-results/debug-logs.txt', 'utf8'); } catch(e) {}

                    const benchmarkLines = debugLog.split('\\n')
                      .filter(l => l.includes('BENCHMARK|') || l.includes('HEADROOM|'));

                    const benchmarks = {};
                    for (const line of benchmarkLines) {
                      const match = line.match(/(BENCHMARK|HEADROOM)\|([^|]+)\|(.+)/);
                      if (!match) continue;
                      const [, type, op, metrics] = match;
                      if (type === 'BENCHMARK') {
                        benchmarks[op] = benchmarks[op] || {};
                        for (const pair of metrics.split('|')) {
                          const [k, v] = pair.split('=');
                          benchmarks[op][k] = v;
                        }
                      }
                      if (type === 'HEADROOM') {
                        benchmarks[op] = benchmarks[op] || {};
                        benchmarks[op].headroom = metrics;
                      }
                    }

                    // Build summary
                    const summary = {
                      timestamp: new Date().toISOString(),
                      testClass: '${{ github.event.inputs.test_class }}',
                      runUrl: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                      tests: tests.map(t => ({
                        name: t.MethodName,
                        outcome: t.Outcome,
                        runTimeMs: t.RunTime
                      })),
                      benchmarks
                    };

                    fs.writeFileSync(
                      'benchmark-results/benchmark-summary.json',
                      JSON.stringify(summary, null, 2)
                    );

                    // GitHub Step Summary
                    const lines = ['## Apex Performance Benchmark Results', ''];
                    lines.push('**Run:** ' + new Date().toISOString());
                    lines.push('**Test Class:** \`${{ github.event.inputs.test_class }}\`');
                    lines.push('');

                    // Test execution times
                    lines.push('### Test Execution Times');
                    lines.push('| Test Method | Result | Runtime |');
                    lines.push('|-------------|--------|---------|');
                    for (const t of tests) {
                      const icon = t.Outcome === 'Pass' ? '✅' : '❌';
                      lines.push('| ' + t.MethodName + ' | ' + icon + ' | ' + (t.RunTime || '--') + 'ms |');
                    }
                    lines.push('');

                    // Governor limit benchmarks
                    if (Object.keys(benchmarks).length > 0) {
                      lines.push('### Governor Limit Consumption');
                      lines.push('| Operation | SOQL Queries | DML Stmts | CPU Time | Heap | Rows |');
                      lines.push('|-----------|-------------|-----------|----------|------|------|');
                      for (const [op, m] of Object.entries(benchmarks)) {
                        lines.push('| ' + op + ' | ' + (m.queries||'--') + ' | ' + (m.dml||'--') + ' | ' + (m.cpu||'--') + ' | ' + (m.heap||'--') + ' | ' + (m.rows||'--') + ' |');
                      }
                      lines.push('');
                      lines.push('### Limit Headroom');
                      lines.push('| Operation | Headroom |');
                      lines.push('|-----------|----------|');
                      for (const [op, m] of Object.entries(benchmarks)) {
                        if (m.headroom) lines.push('| ' + op + ' | ' + m.headroom + ' |');
                      }
                    } else {
                      lines.push('> ⚠️ No BENCHMARK lines found in debug logs. Ensure debug log level is set to DEBUG or higher.');
                      lines.push('> Benchmark data is embedded in System.debug() calls — it requires log capture to parse.');
                    }

                    lines.push('');
                    lines.push('---');
                    lines.push('*Benchmark data captured from Apex Limits class via PerformanceBenchmarkTest*');

                    fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n'));
                  "

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org bench-org --no-prompt || true

            - name: Upload Benchmark Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: apex-benchmark-results
                  path: benchmark-results/
                  retention-days: 90
