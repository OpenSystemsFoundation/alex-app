name: E2E Multi-User Tests

on:
    pull_request:
        branches: [main]
        paths:
            - 'force-app/main/default/lwc/**'
            - 'e2e/**'
            - 'playwright.config.js'
    workflow_dispatch:

jobs:
    e2e-multi-user:
        name: Multi-User Sync Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright
              run: npx playwright install --with-deps chromium

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-test \
                    --duration-days 1 \
                    --wait 10

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-test --ignore-conflicts

            - name: Assign Admin Permission Set
              run: sf org assign permset --name Alex_Admin --target-org e2e-test

            - name: Create Second User
              run: |
                  sf org create user \
                    --target-org e2e-test \
                    --set-alias e2e-user2 \
                    --definition-file config/e2e-test-user-def.json

            - name: Assign Permission Set to User B
              run: |
                  sf org assign permset \
                    --name Alex_User \
                    --target-org e2e-test \
                    --on-behalf-of e2e-user2

            - name: Generate Password for User B
              run: |
                  sf org generate password --target-org e2e-test --on-behalf-of e2e-user2

            - name: Create Test Data
              run: |
                  sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-test

            - name: Get Login URLs
              id: login
              run: |
                  USER_A_URL=$(sf org open --target-org e2e-test --url-only --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      console.log(JSON.parse(d).result.url);
                    });
                  ")
                  USER_B_URL=$(sf org open --target-org e2e-user2 --url-only --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      console.log(JSON.parse(d).result.url);
                    });
                  ")
                  echo "user_a_url=$USER_A_URL" >> "$GITHUB_OUTPUT"
                  echo "user_b_url=$USER_B_URL" >> "$GITHUB_OUTPUT"

            - name: Run Multi-User E2E Tests
              env:
                  USER_A_LOGIN_URL: ${{ steps.login.outputs.user_a_url }}
                  USER_B_LOGIN_URL: ${{ steps.login.outputs.user_b_url }}
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.user_a_url }}
              run: |
                  npx playwright test --project=chromium \
                    --grep="real-time collaboration"

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: multi-user-report
                  path: playwright-report/
                  retention-days: 14

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: multi-user-traces
                  path: test-results/
                  retention-days: 7

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-test --no-prompt || true
