name: E2E Multi-User Suite (Reusable)

on:
    workflow_call:
        inputs:
            suite-name:
                description: 'Name for this suite'
                required: true
                type: string
            specs:
                description: 'Space-separated list of spec filenames to run'
                required: true
                type: string
            grep:
                description: 'Playwright --grep filter'
                required: false
                type: string
                default: ''
            debug:
                description: 'Enable traces for all tests'
                required: false
                type: boolean
                default: false

jobs:
    run:
        name: ${{ inputs.suite-name }}
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Setup Scratch Org
              id: org
              uses: ./.github/actions/setup-e2e-org
              with:
                  org-alias: e2e-${{ inputs.suite-name }}
                  sfdx-auth-url: ${{ secrets.SFDX_AUTH_URL }}
                  create-retro-data: 'true'

            - name: Create Second User (User B)
              run: |
                  sf org create user \
                    --target-org e2e-${{ inputs.suite-name }} \
                    --set-alias e2e-user-b \
                    --definition-file config/e2e-test-user-def.json

            - name: Assign Permission Set to User B
              run: |
                  sf org assign permset \
                    --name Alex_User \
                    --target-org e2e-${{ inputs.suite-name }} \
                    --on-behalf-of e2e-user-b

            - name: Generate Password for User B
              run: sf org generate password --target-org e2e-${{ inputs.suite-name }} --on-behalf-of e2e-user-b

            - name: Get Login URLs
              id: login
              run: |
                  USER_A_URL=$(sf org open --target-org e2e-${{ inputs.suite-name }} --url-only --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      console.log(JSON.parse(d).result.url);
                    });
                  ")
                  USER_B_URL=$(sf org open --target-org e2e-user-b --url-only --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      console.log(JSON.parse(d).result.url);
                    });
                  ")
                  echo "user_a_url=$USER_A_URL" >> "$GITHUB_OUTPUT"
                  echo "user_b_url=$USER_B_URL" >> "$GITHUB_OUTPUT"

            - name: Run Multi-User Playwright Tests
              id: playwright
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.user_a_url }}
                  USER_A_LOGIN_URL: ${{ steps.login.outputs.user_a_url }}
                  USER_B_LOGIN_URL: ${{ steps.login.outputs.user_b_url }}
                  SF_TARGET_ORG: e2e-${{ inputs.suite-name }}
              run: |
                  set +e

                  SPEC_ARGS=""
                  for spec in ${{ inputs.specs }}; do
                    SPEC_ARGS="$SPEC_ARGS e2e/specs/$spec"
                  done

                  GREP_ARG=""
                  if [ -n "${{ inputs.grep }}" ]; then
                    GREP_ARG="--grep=\"${{ inputs.grep }}\""
                  fi
                  TRACE_ARG=""
                  if [ "${{ inputs.debug }}" = "true" ]; then
                    TRACE_ARG="--trace on"
                  fi

                  # Multi-user tests use 1 worker to avoid session conflicts
                  npx playwright test \
                    --project=chromium \
                    --retries=1 \
                    --workers=1 \
                    --reporter=list \
                    $GREP_ARG $TRACE_ARG \
                    $SPEC_ARGS \
                    2>&1 | tee /tmp/playwright-output.txt
                  echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Upload output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-output-${{ inputs.suite-name }}
                  path: /tmp/playwright-output.txt
                  retention-days: 3

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: e2e-report-${{ inputs.suite-name }}
                  path: playwright-report/
                  retention-days: 7

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: e2e-traces-${{ inputs.suite-name }}
                  path: test-results/
                  retention-days: 7

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-${{ inputs.suite-name }} --no-prompt || true

            - name: Fail if tests failed
              if: always() && steps.playwright.outputs.exit_code != '0'
              run: exit 1
