name: E2E Cleanup (Persistent Orgs)

# Cleans up persistent scratch org caches when a PR is closed or merged,
# or when a claude/* branch is deleted. This ensures scratch orgs expire
# naturally (7-day duration) without consuming cache space.

on:
    pull_request:
        types: [closed]
        branches: [main]
    delete:
        branches:
            - 'claude/**'

jobs:
    cleanup-caches:
        name: Delete cached org auth
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Determine branch key
              id: branch
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo "key=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = "delete" ]; then
                    echo "key=${{ github.event.ref }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Delete scratch org caches for branch
              if: steps.branch.outputs.key != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH_KEY: ${{ steps.branch.outputs.key }}
              run: |
                  echo "Cleaning up persistent scratch org caches for branch: $BRANCH_KEY"

                  SUITES="board-core backlog-sprint admin retro-analytics planning-poker unhappy-paths multi-user"

                  for suite in $SUITES; do
                    for prefix in "scratch-org" "scratch-org-user-b"; do
                      CACHE_KEY="${prefix}-${BRANCH_KEY}-e2e-${suite}"
                      echo "Deleting cache: $CACHE_KEY"
                      gh cache delete "$CACHE_KEY" --repo "${{ github.repository }}" 2>/dev/null || true
                    done
                  done

                  # Also clean up any debug suite caches (pattern match)
                  echo "Scanning for additional cached orgs on this branch..."
                  gh cache list --repo "${{ github.repository }}" --key "scratch-org-${BRANCH_KEY}-" --json key --jq '.[].key' 2>/dev/null | while read -r key; do
                    echo "Deleting cache: $key"
                    gh cache delete "$key" --repo "${{ github.repository }}" 2>/dev/null || true
                  done

                  echo "Cleanup complete. Scratch orgs will expire naturally (7-day duration)."
