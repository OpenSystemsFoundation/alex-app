# .github/workflows/agentforce-dual-org-tests.yml
name: Agentforce Dual-Org Test Matrix

# Runs the full Apex test suite against both Agentforce scratch org variants
# in parallel to catch environment-specific regressions.

on:
    workflow_dispatch:
        inputs:
            package:
                description: 'Which org variant(s) to test'
                type: choice
                default: 'both'
                options:
                    - standard
                    - data-cloud
                    - both

env:
    SFDX_DISABLE_DNS_CHECK: 'true'

concurrency:
    group: agentforce-dual-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-standard:
        name: Apex Tests — Agentforce Standard
        runs-on: ubuntu-latest
        if: >
            github.event_name != 'workflow_dispatch' ||
            inputs.package == 'standard' ||
            inputs.package == 'both'
        steps:
            - uses: actions/checkout@v4

            - name: Setup Agentforce Org
              id: org
              uses: ./.github/actions/setup-agentforce-org
              with:
                  org-alias: af-dual-standard
                  sfdx-auth-url: ${{ secrets.SFDX_AUTH_URL }}
                  scratch-def: config/agentforce-project-scratch-def.json
                  create-board-data: false
                  deploy-agentforce: false
                  persistent: true
                  cache-key: ${{ github.head_ref || github.ref_name }}
                  duration-days: '7'

            - name: Run All Apex Tests
              id: run-tests
              run: |
                  mkdir -p apex-results
                  sf apex run test \
                    --target-org af-dual-standard \
                    --code-coverage \
                    --result-format json \
                    --wait 15 > apex-results/test-run.json 2>&1 || true

                  node -e "
                    const fs=require('fs');
                    const raw=fs.readFileSync('apex-results/test-run.json','utf8');
                    const jsonStart=raw.indexOf('{');
                    if(jsonStart<0){console.error('No JSON in output');console.log(raw);process.exit(1)}
                    const j=JSON.parse(raw.substring(jsonStart));
                    const r=j.result||j;
                    const tests=r.tests||[];
                    const failed=tests.filter(t=>t.Outcome==='Fail');
                    const passed=tests.filter(t=>t.Outcome==='Pass');
                    const total=tests.length;
                    const lines=[];

                    lines.push('');
                    lines.push('='.repeat(60));
                    lines.push('  AGENTFORCE STANDARD — ALL APEX TESTS');
                    lines.push('='.repeat(60));

                    tests.forEach(t=>{
                      const cls=(t.ApexClass&&t.ApexClass.Name)||'Unknown';
                      const icon=t.Outcome==='Pass'?'PASS':'FAIL';
                      lines.push('  ['+icon+'] '+cls+'.'+t.MethodName+' ('+(t.RunTime||'--')+'ms)');
                    });

                    lines.push('');
                    lines.push('  Passed: '+passed.length+'/'+total);
                    lines.push('  Coverage: '+((r.summary||{}).orgWideCoverage||'N/A'));

                    if(failed.length>0){
                      lines.push('');
                      lines.push('  FAILURES:');
                      failed.forEach(t=>{
                        const cls=(t.ApexClass&&t.ApexClass.Name)||'Unknown';
                        lines.push('    '+cls+'.'+t.MethodName+': '+t.Message);
                        if(t.StackTrace) t.StackTrace.split('\\n').forEach(l=>lines.push('      '+l));
                      });
                    }

                    const output=lines.join('\\n');
                    console.log(output);
                    fs.writeFileSync('/tmp/test-results-standard.txt', output);
                    if(failed.length>0) process.exit(1);
                  "

            - name: Post results as commit comment
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  BODY="## Dual-Org Tests — Agentforce Standard\n\n"
                  BODY+="**Workflow:** [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n"
                  BODY+="**Branch:** \`${{ github.ref_name }}\`\n\n"

                  if [ "${{ steps.org.outcome }}" = "failure" ]; then
                    ERROR_FILE="${{ steps.org.outputs.error-log }}"
                    if [ -f "$ERROR_FILE" ] && [ -s "$ERROR_FILE" ]; then
                      BODY+="### Org Setup Failed\n\`\`\`\n$(tail -50 "$ERROR_FILE")\n\`\`\`\n\n"
                    else
                      BODY+="### Org Setup Failed\nThe setup-agentforce-org composite action failed. Check if:\n"
                      BODY+="- DevHub auth URL (SFDX_AUTH_URL secret) is valid\n"
                      BODY+="- Scratch org limits haven't been exceeded\n"
                      BODY+="- The scratch def file is valid\n\n"
                    fi
                  fi

                  if [ -f /tmp/test-results-standard.txt ]; then
                    BODY+="### Apex Test Results\n\`\`\`\n$(cat /tmp/test-results-standard.txt)\n\`\`\`\n\n"
                  elif [ "${{ steps.run-tests.outcome }}" = "skipped" ]; then
                    BODY+="### Apex Tests\nSkipped (org setup failed)\n\n"
                  fi

                  BODY+="**Job status:** ${{ job.status }}"

                  printf '%s' "$BODY" | gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
                    -f "body=$(printf '%s' "$BODY")" --silent || echo "Warning: Failed to post commit comment"

            - name: Delete Scratch Org
              if: always() && steps.org.outputs.org-created == 'true' && failure()
              run: sf org delete scratch --target-org af-dual-standard --no-prompt || true

            - name: Upload Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: apex-results-agentforce-standard
                  path: apex-results/
                  retention-days: 7

    test-data-cloud:
        name: Apex Tests — Agentforce + Data Cloud
        runs-on: ubuntu-latest
        if: >
            github.event_name != 'workflow_dispatch' ||
            inputs.package == 'data-cloud' ||
            inputs.package == 'both'
        steps:
            - uses: actions/checkout@v4

            - name: Setup Agentforce Org
              id: org
              uses: ./.github/actions/setup-agentforce-org
              with:
                  org-alias: af-dual-dc
                  sfdx-auth-url: ${{ secrets.SFDX_AUTH_URL }}
                  scratch-def: config/dc-agentforce-project-scratch-def.json
                  create-board-data: false
                  deploy-agentforce: false
                  persistent: true
                  cache-key: ${{ github.head_ref || github.ref_name }}
                  duration-days: '7'

            - name: Run All Apex Tests
              id: run-tests
              run: |
                  mkdir -p apex-results
                  sf apex run test \
                    --target-org af-dual-dc \
                    --code-coverage \
                    --result-format json \
                    --wait 15 > apex-results/test-run.json 2>&1 || true

                  node -e "
                    const fs=require('fs');
                    const raw=fs.readFileSync('apex-results/test-run.json','utf8');
                    const jsonStart=raw.indexOf('{');
                    if(jsonStart<0){console.error('No JSON in output');console.log(raw);process.exit(1)}
                    const j=JSON.parse(raw.substring(jsonStart));
                    const r=j.result||j;
                    const tests=r.tests||[];
                    const failed=tests.filter(t=>t.Outcome==='Fail');
                    const passed=tests.filter(t=>t.Outcome==='Pass');
                    const total=tests.length;
                    const lines=[];

                    lines.push('');
                    lines.push('='.repeat(60));
                    lines.push('  AGENTFORCE + DATA CLOUD — ALL APEX TESTS');
                    lines.push('='.repeat(60));

                    tests.forEach(t=>{
                      const cls=(t.ApexClass&&t.ApexClass.Name)||'Unknown';
                      const icon=t.Outcome==='Pass'?'PASS':'FAIL';
                      lines.push('  ['+icon+'] '+cls+'.'+t.MethodName+' ('+(t.RunTime||'--')+'ms)');
                    });

                    lines.push('');
                    lines.push('  Passed: '+passed.length+'/'+total);
                    lines.push('  Coverage: '+((r.summary||{}).orgWideCoverage||'N/A'));

                    if(failed.length>0){
                      lines.push('');
                      lines.push('  FAILURES:');
                      failed.forEach(t=>{
                        const cls=(t.ApexClass&&t.ApexClass.Name)||'Unknown';
                        lines.push('    '+cls+'.'+t.MethodName+': '+t.Message);
                        if(t.StackTrace) t.StackTrace.split('\\n').forEach(l=>lines.push('      '+l));
                      });
                    }

                    const output=lines.join('\\n');
                    console.log(output);
                    fs.writeFileSync('/tmp/test-results-dc.txt', output);
                    if(failed.length>0) process.exit(1);
                  "

            - name: Post results as commit comment
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  BODY="## Dual-Org Tests — Agentforce + Data Cloud\n\n"
                  BODY+="**Workflow:** [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n"
                  BODY+="**Branch:** \`${{ github.ref_name }}\`\n\n"

                  if [ "${{ steps.org.outcome }}" = "failure" ]; then
                    ERROR_FILE="${{ steps.org.outputs.error-log }}"
                    if [ -f "$ERROR_FILE" ] && [ -s "$ERROR_FILE" ]; then
                      BODY+="### Org Setup Failed\n\`\`\`\n$(tail -50 "$ERROR_FILE")\n\`\`\`\n\n"
                    else
                      BODY+="### Org Setup Failed\nThe setup-agentforce-org composite action failed. Check if:\n"
                      BODY+="- DevHub auth URL (SFDX_AUTH_URL secret) is valid\n"
                      BODY+="- Scratch org limits haven't been exceeded\n"
                      BODY+="- The scratch def file is valid\n\n"
                    fi
                  fi

                  if [ -f /tmp/test-results-dc.txt ]; then
                    BODY+="### Apex Test Results\n\`\`\`\n$(cat /tmp/test-results-dc.txt)\n\`\`\`\n\n"
                  elif [ "${{ steps.run-tests.outcome }}" = "skipped" ]; then
                    BODY+="### Apex Tests\nSkipped (org setup failed)\n\n"
                  fi

                  BODY+="**Job status:** ${{ job.status }}"

                  printf '%s' "$BODY" | gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
                    -f "body=$(printf '%s' "$BODY")" --silent || echo "Warning: Failed to post commit comment"

            - name: Delete Scratch Org
              if: always() && steps.org.outputs.org-created == 'true' && failure()
              run: sf org delete scratch --target-org af-dual-dc --no-prompt || true

            - name: Upload Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: apex-results-agentforce-data-cloud
                  path: apex-results/
                  retention-days: 7

    summary:
        name: Dual-Org Test Summary
        runs-on: ubuntu-latest
        needs: [test-standard, test-data-cloud]
        if: always()
        steps:
            - name: Post Summary
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  STANDARD="${{ needs.test-standard.result }}"
                  DC="${{ needs.test-data-cloud.result }}"

                  cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
                  ## Agentforce Dual-Org Apex Test Results

                  | Org Variant | Result |
                  |-------------|--------|
                  | Agentforce Standard (Einstein1 + Agent Platform) | ${STANDARD} |
                  | Agentforce + Data Cloud (Einstein1 + Agent + CDP) | ${DC} |

                  Both orgs deploy \`force-app\` (base package) + \`force-agentforce\` (extension)
                  then run the complete Apex test suite including all Agent action tests.
                  SUMMARY

                  if [ "$STANDARD" = "failure" ] || [ "$DC" = "failure" ]; then
                    echo "::error::One or more dual-org test jobs failed"
                    exit 1
                  fi
