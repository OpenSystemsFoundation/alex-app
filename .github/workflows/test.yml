name: Test

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        name: Lint & LWC Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run prettier:verify

            - name: Lint
              run: npm run lint
              continue-on-error: true

            - name: LWC Jest tests
              run: npm run test:unit:coverage

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lwc-coverage
                  path: coverage/
                  retention-days: 14
