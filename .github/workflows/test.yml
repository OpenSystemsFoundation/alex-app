name: Test

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        name: Lint & LWC Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              id: prettier
              run: |
                  npm run prettier:verify 2>&1 | tee /tmp/prettier-output.txt
              continue-on-error: true

            - name: Report formatting issues
              if: steps.prettier.outcome == 'failure'
              run: |
                  echo "## Prettier Formatting Issues" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat /tmp/prettier-output.txt >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  exit 1

            - name: Lint
              run: npm run lint
              continue-on-error: true

            - name: LWC Jest tests
              id: jest
              run: |
                  npm run test:unit:coverage 2>&1 | tee /tmp/jest-output.txt
              continue-on-error: true

            - name: Report test results
              if: always()
              run: |
                  echo "## LWC Jest Test Results" >> $GITHUB_STEP_SUMMARY

                  # Extract summary lines
                  if grep -q "Test Suites:" /tmp/jest-output.txt 2>/dev/null; then
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      grep -E "Test Suites:|Tests:|Snapshots:|Time:" /tmp/jest-output.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                  fi

                  # Show coverage summary
                  if grep -q "Coverage summary" /tmp/jest-output.txt 2>/dev/null; then
                      echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      sed -n '/Coverage summary/,/^$/p' /tmp/jest-output.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                  fi

                  # Show coverage threshold failures
                  if grep -q "coverage threshold" /tmp/jest-output.txt 2>/dev/null; then
                      echo "### Coverage Threshold Failures" >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      grep "coverage threshold" /tmp/jest-output.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                  fi

                  # Show failed tests
                  if grep -q "FAIL " /tmp/jest-output.txt 2>/dev/null; then
                      echo "### Failed Test Suites" >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      grep "FAIL " /tmp/jest-output.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Fail if tests failed
              if: steps.jest.outcome == 'failure'
              run: exit 1

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lwc-coverage
                  path: coverage/
                  retention-days: 14
