name: Chromium E2E Debug

on:
    push:
        branches:
            - 'claude/**'
        paths:
            - 'e2e/**'
            - 'force-app/**'
            - '.github/workflows/chromium-e2e-debug.yml'
            - 'playwright.config.ts'
    workflow_dispatch:
        inputs:
            grep:
                description: 'Filter tests by name (Playwright --grep)'
                required: false
            debug:
                description: 'Enable Playwright debug traces for all tests'
                type: boolean
                default: false
            shards:
                description: 'Number of parallel shards (scratch orgs)'
                type: choice
                options: ['1', '2', '3', '4']
                default: '4'

jobs:
    e2e-shard:
        name: 'Shard ${{ matrix.shard }}/${{ strategy.job-total }}'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-shard-${{ matrix.shard }} \
                    --duration-days 1 \
                    --wait 15

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-shard-${{ matrix.shard }} --ignore-conflicts

            - name: Assign Permission Sets
              run: sf org assign permset --name Alex_Admin --target-org e2e-shard-${{ matrix.shard }}

            - name: Create Sample Data
              run: |
                  sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-shard-${{ matrix.shard }}

            - name: Create Retrospective Data
              run: |
                  sf apex run --target-org e2e-shard-${{ matrix.shard }} <<'APEX'
                  OpenSF__Board__c board = [SELECT Id FROM OpenSF__Board__c ORDER BY CreatedDate DESC LIMIT 1];
                  OpenSF__Retrospective__c retro = new OpenSF__Retrospective__c(
                      OpenSF__Status__c = 'Active',
                      OpenSF__Template__c = 'Start_Stop_Continue',
                      OpenSF__MaxVotesPerUser__c = 5,
                      OpenSF__Board__c = board.Id
                  );
                  insert retro;
                  System.debug('E2E_RETRO_ID:' + retro.Id);
                  APEX

            - name: Get Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org e2e-shard-${{ matrix.shard }} --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      const j=JSON.parse(d);
                      console.log(j.result.url);
                    });
                  ")
                  echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

            - name: Run Playwright Tests (Shard ${{ matrix.shard }}/4)
              id: playwright
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
                  SF_TARGET_ORG: e2e-shard-${{ matrix.shard }}
              run: |
                  set +e
                  GREP_ARG=""
                  if [ -n "${{ inputs.grep }}" ]; then
                    GREP_ARG="--grep=\"${{ inputs.grep }}\""
                  fi
                  TRACE_ARG=""
                  if [ "${{ inputs.debug }}" = "true" ]; then
                    TRACE_ARG="--trace on"
                  fi

                  npx playwright test \
                    --project=chromium \
                    --retries=1 \
                    --workers=2 \
                    --reporter=list \
                    --shard=${{ matrix.shard }}/4 \
                    $GREP_ARG $TRACE_ARG \
                    2>&1 | tee /tmp/playwright-output.txt
                  echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Upload shard output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: shard-output-${{ matrix.shard }}
                  path: /tmp/playwright-output.txt
                  retention-days: 1

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-shard-${{ matrix.shard }}
                  path: playwright-report/
                  retention-days: 7

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces-shard-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-shard-${{ matrix.shard }} --no-prompt || true

    collect-results:
        name: Collect Results
        runs-on: ubuntu-latest
        needs: e2e-shard
        if: always()
        timeout-minutes: 5

        steps:
            - name: Download all shard outputs
              uses: actions/download-artifact@v4
              with:
                  pattern: shard-output-*
                  path: shard-outputs

            - name: Merge results
              id: merge
              run: |
                  echo "## Shard Results" > /tmp/merged-output.txt
                  echo "" >> /tmp/merged-output.txt

                  TOTAL_PASSED=0
                  TOTAL_FAILED=0
                  TOTAL_SKIPPED=0
                  TOTAL_FLAKY=0
                  ALL_PASSED=true

                  for shard in 1 2 3 4; do
                    FILE="shard-outputs/shard-output-${shard}/playwright-output.txt"
                    if [ -f "$FILE" ]; then
                      echo "### Shard ${shard}/4" >> /tmp/merged-output.txt
                      echo '```' >> /tmp/merged-output.txt
                      # Extract last 60 lines (summary area) to keep comment size manageable
                      tail -60 "$FILE" >> /tmp/merged-output.txt
                      echo '```' >> /tmp/merged-output.txt
                      echo "" >> /tmp/merged-output.txt

                      # Parse counts from output
                      PASSED=$(grep -oP '\d+ passed' "$FILE" | tail -1 | grep -oP '\d+' || echo 0)
                      FAILED=$(grep -oP '\d+ failed' "$FILE" | tail -1 | grep -oP '\d+' || echo 0)
                      SKIPPED=$(grep -oP '\d+ skipped' "$FILE" | tail -1 | grep -oP '\d+' || echo 0)
                      FLAKY=$(grep -oP '\d+ flaky' "$FILE" | tail -1 | grep -oP '\d+' || echo 0)

                      TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
                      TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
                      TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
                      TOTAL_FLAKY=$((TOTAL_FLAKY + FLAKY))

                      if [ "$FAILED" -gt 0 ]; then
                        ALL_PASSED=false
                      fi
                    else
                      echo "### Shard ${shard}/4 — ⚠️ No output (org creation may have failed)" >> /tmp/merged-output.txt
                      echo "" >> /tmp/merged-output.txt
                      ALL_PASSED=false
                    fi
                  done

                  SUMMARY="**${TOTAL_PASSED} passed** | **${TOTAL_FAILED} failed** | **${TOTAL_SKIPPED} skipped** | **${TOTAL_FLAKY} flaky**"
                  echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

                  if [ "$ALL_PASSED" = true ]; then
                    echo "status=✅" >> "$GITHUB_OUTPUT"
                  else
                    echo "status=❌" >> "$GITHUB_OUTPUT"
                  fi

            - name: Post Results as Commit Comment
              if: github.event_name == 'push'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const merged = fs.existsSync('/tmp/merged-output.txt')
                        ? fs.readFileSync('/tmp/merged-output.txt', 'utf8')
                        : 'No output captured';
                      const maxLen = 60000;
                      const truncated = merged.length > maxLen
                        ? '…truncated…\n' + merged.slice(-maxLen)
                        : merged;
                      const status = '${{ steps.merge.outputs.status }}';
                      const summary = '${{ steps.merge.outputs.summary }}';
                      const sha = context.sha.substring(0, 7);
                      const body = `### ${status} Chromium E2E Debug — \`${sha}\` (4 shards)\n\n${summary}\n\n<details><summary>Per-shard output (click to expand)</summary>\n\n${truncated}\n\n</details>`;

                      await github.rest.repos.createCommitComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                        body,
                      });

            - name: Post Workflow Summary
              if: always()
              run: |
                  STATUS="${{ steps.merge.outputs.status }}"
                  SUMMARY="${{ steps.merge.outputs.summary }}"
                  echo "## ${STATUS} Chromium E2E Debug — 4 Shards" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  cat /tmp/merged-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

            - name: Fail if any shard failed
              if: needs.e2e-shard.result == 'failure'
              run: exit 1
