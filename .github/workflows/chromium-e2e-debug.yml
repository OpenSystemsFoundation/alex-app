name: Chromium E2E Debug

# Iterative E2E debug workflow for feature branches.
# Add suites below as you develop new features, then promote
# passing tests to e2e-tests.yml (PR-to-main) when stable.
#
# Scratch orgs are PERSISTENT — cached per branch+suite and reused
# across pushes. Only source is redeployed on subsequent runs.
# Orgs are cleaned up by the e2e-cleanup.yml workflow on PR close.
#
# Usage:
#   1. Create specs in e2e/specs/ for the feature you're building
#   2. Add a job below that references those specs via e2e-suite.yml
#   3. Push to your claude/* branch -- results posted as commit comments
#   4. Read results: gh api repos/OWNER/REPO/commits/SHA/comments
#   5. Fix, push, repeat until green
#   6. Promote stable tests to e2e-tests.yml
#
# Available reusable workflows:
#   ./.github/workflows/e2e-suite.yml       -- single-user suite
#   ./.github/workflows/e2e-multi-user.yml  -- multi-user suite (2 users, 1 org)

on:
    push:
        branches:
            - 'claude/**'
        paths:
            - 'e2e/**'
            - 'force-app/**'
            - 'force-design-thinking/**'
            - '.github/workflows/e2e-*.yml'
            - '.github/workflows/chromium-e2e-debug.yml'
            - '.github/actions/setup-e2e-org/**'
            - 'playwright.config.ts'
    workflow_dispatch:
        inputs:
            grep:
                description: 'Filter tests by name (Playwright --grep)'
                required: false
            debug:
                description: 'Enable Playwright debug traces for all tests'
                type: boolean
                default: false

concurrency:
    group: e2e-debug-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ---------------------------------------------------------------
    # Add feature-specific suites here during development.
    # Each suite reuses a persistent scratch org cached per branch.
    #
    # Example:
    #
    #   my-feature:
    #       name: My Feature
    #       uses: ./.github/workflows/e2e-suite.yml
    #       secrets: inherit
    #       with:
    #           suite-name: my-feature
    #           specs: 'my-feature.spec.ts'
    #           create-retro-data: false
    #           persistent: true
    #           cache-key: ${{ github.ref_name }}
    #           grep: ${{ inputs.grep || '' }}
    #           debug: ${{ inputs.debug || false }}
    #
    # For multi-user tests:
    #
    #   my-feature-sync:
    #       name: My Feature Sync
    #       uses: ./.github/workflows/e2e-multi-user.yml
    #       secrets: inherit
    #       with:
    #           suite-name: my-feature-sync
    #           specs: 'my-feature-sync.spec.ts'
    #           persistent: true
    #           cache-key: ${{ github.ref_name }}
    #           grep: ${{ inputs.grep || '' }}
    #           debug: ${{ inputs.debug || false }}
    # ---------------------------------------------------------------

    card-comments:
        name: Card Comments
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: card-comments
            specs: 'card-comments.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    card-files:
        name: Card File Attachments
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: card-files
            specs: 'card-files.spec.ts card-panel.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    undo-redo:
        name: Undo/Redo
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: undo-redo
            specs: 'undo-redo.spec.ts board-toolbar.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    team-management:
        name: Team Management
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: team-management
            specs: 'team-management.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    card-linking:
        name: Card Linking
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: card-linking
            specs: 'card-linking.spec.ts'
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    # --- Core Board & Sprints ---

    kanban-board:
        name: Kanban Board
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: kanban-board
            specs: 'kanban-board.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    unhappy-paths:
        name: Unhappy Paths
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: unhappy-paths
            specs: 'unhappy-paths.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    sprint-management:
        name: Sprint Management
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: sprint-management
            specs: 'sprint-management.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    # --- Design Thinking Extension ---

    design-thinking:
        name: Design Thinking
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: design-thinking
            specs: 'design-thinking.spec.ts'
            create-retro-data: false
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    # --- Multi-user Suites ---

    drag-drop-sync:
        name: Drag & Drop Sync
        uses: ./.github/workflows/e2e-multi-user.yml
        secrets: inherit
        with:
            suite-name: drag-drop-sync
            specs: 'drag-drop-sync.spec.ts'
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}

    design-thinking-sync:
        name: Design Thinking Sync
        uses: ./.github/workflows/e2e-multi-user.yml
        secrets: inherit
        with:
            suite-name: design-thinking-sync
            specs: 'design-thinking-sync.spec.ts'
            grep: ${{ inputs.grep || '' }}
            debug: ${{ inputs.debug || false }}
