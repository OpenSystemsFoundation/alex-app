name: Chromium E2E Debug

on:
    push:
        branches:
            - 'claude/**'
        paths:
            - 'e2e/**'
            - 'force-app/**'
            - '.github/workflows/chromium-e2e-debug.yml'
            - 'playwright.config.ts'
    workflow_dispatch:
        inputs:
            grep:
                description: 'Filter tests by name (Playwright --grep)'
                required: false
            debug:
                description: 'Enable Playwright debug traces for all tests'
                type: boolean
                default: false

jobs:
    e2e-chromium:
        name: Chromium E2E Debug
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-debug \
                    --duration-days 1 \
                    --wait 15

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-debug --ignore-conflicts

            - name: Assign Permission Sets
              run: sf org assign permset --name Alex_Admin --target-org e2e-debug

            - name: Create Sample Data
              run: |
                  sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-debug

            - name: Create Retrospective Data
              run: |
                  sf apex run --target-org e2e-debug <<'APEX'
                  // Query the most recent board
                  OpenSF__Board__c board = [SELECT Id FROM OpenSF__Board__c ORDER BY CreatedDate DESC LIMIT 1];

                  // Create a retrospective linked to the board
                  OpenSF__Retrospective__c retro = new OpenSF__Retrospective__c(
                      OpenSF__Status__c = 'Active',
                      OpenSF__Template__c = 'Start_Stop_Continue',
                      OpenSF__MaxVotesPerUser__c = 5,
                      OpenSF__Board__c = board.Id
                  );
                  insert retro;
                  System.debug('E2E_RETRO_ID:' + retro.Id);
                  APEX

            - name: Get Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org e2e-debug --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      const j=JSON.parse(d);
                      console.log(j.result.url);
                    });
                  ")
                  echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

            - name: Run Playwright Tests
              id: playwright
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
                  SF_TARGET_ORG: e2e-debug
              run: |
                  set +e
                  GREP_ARG=""
                  if [ -n "${{ inputs.grep }}" ]; then
                    GREP_ARG="--grep=\"${{ inputs.grep }}\""
                  fi
                  TRACE_ARG=""
                  if [ "${{ inputs.debug }}" = "true" ]; then
                    TRACE_ARG="--trace on"
                  fi

                  npx playwright test \
                    --project=chromium \
                    --retries=1 \
                    --reporter=list \
                    $GREP_ARG $TRACE_ARG \
                    2>&1 | tee /tmp/playwright-output.txt
                  echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Post Results as Commit Comment
              if: always() && github.event_name == 'push'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const output = fs.existsSync('/tmp/playwright-output.txt')
                        ? fs.readFileSync('/tmp/playwright-output.txt', 'utf8')
                        : 'No output captured';
                      const maxLen = 60000;
                      const truncated = output.length > maxLen
                        ? '…truncated…\n' + output.slice(-maxLen)
                        : output;
                      const status = '${{ steps.playwright.outputs.exit_code }}' === '0' ? '✅' : '❌';
                      const sha = context.sha.substring(0, 7);
                      const body = `### ${status} Chromium E2E Debug — \`${sha}\`\n\n<details><summary>Playwright output (click to expand)</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;

                      await github.rest.repos.createCommitComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                        body,
                      });

            - name: Post Results as Workflow Summary
              if: always()
              run: |
                  STATUS="${{ steps.playwright.outputs.exit_code }}"
                  if [ "$STATUS" = "0" ]; then
                    echo "## ✅ Chromium E2E Debug — All tests passed" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "## ❌ Chromium E2E Debug — Some tests failed" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tail -100 /tmp/playwright-output.txt >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-chromium-debug
                  path: playwright-report/
                  retention-days: 7

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces-chromium-debug
                  path: test-results/
                  retention-days: 7

            - name: Fail if tests failed
              if: always() && steps.playwright.outputs.exit_code != '0'
              run: exit 1

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-debug --no-prompt || true
