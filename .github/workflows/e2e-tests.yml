name: E2E Tests (Playwright)

on:
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: false

jobs:
    e2e:
        name: E2E (${{ matrix.browser }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.branch || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-test \
                    --duration-days 1 \
                    --wait 10

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-test --ignore-conflicts

            - name: Assign Permission Sets
              run: sf org assign permset --name Alex_Admin --target-org e2e-test

            - name: Create Sample Data
              run: |
                  sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-test

            - name: Get Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org e2e-test --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      const j=JSON.parse(d);
                      console.log(j.result.url);
                    });
                  ")
                  echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

            - name: Run Playwright Tests
              id: playwright
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
              run: |
                  set +e
                  npx playwright test --project=${{ matrix.browser }} --retries=0 --grep-invert="Visual Regression" 2>&1 | tee /tmp/playwright-output.txt
                  echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Post E2E Results to PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const output = fs.existsSync('/tmp/playwright-output.txt')
                        ? fs.readFileSync('/tmp/playwright-output.txt', 'utf8')
                        : 'No output captured';
                      const maxLen = 60000;
                      const truncated = output.length > maxLen
                        ? '…truncated…\n' + output.slice(-maxLen)
                        : output;
                      const status = '${{ steps.playwright.outputs.exit_code }}' === '0' ? '✅' : '❌';
                      const body = `### ${status} E2E Results — ${{ matrix.browser }}\n\n<details><summary>Playwright output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });
                      const marker = `E2E Results — ${{ matrix.browser }}`;
                      const existing = comments.find(c => c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }

            - name: Fail if tests failed
              if: always() && steps.playwright.outputs.exit_code != '0'
              run: exit 1

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: playwright-report/
                  retention-days: 14

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces-${{ matrix.browser }}
                  path: test-results/
                  retention-days: 7

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-test --no-prompt || true
