name: E2E Tests

on:
    push:
        branches: [main, develop, refactor]
    pull_request:
        branches: [main, develop, refactor]
    workflow_dispatch:

jobs:
    test-e2e:
        name: Playwright E2E Tests
        timeout-minutes: 60
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Run Playwright tests
              env:
                  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
                  SF_USERNAME: ${{ secrets.SF_USERNAME }}
                  SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
                  SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
                  SF_BOARD_ID: ${{ secrets.SF_BOARD_ID }}
              run: npx playwright test --project=${{ matrix.browser }}

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: playwright-report/
                  retention-days: 30

            - name: Upload test artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.browser }}
                  path: test-results/
                  retention-days: 30

    test-e2e-mobile:
        name: Playwright Mobile E2E Tests
        timeout-minutes: 60
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                device: [mobile-chrome, mobile-safari]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright mobile tests
              env:
                  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
                  SF_USERNAME: ${{ secrets.SF_USERNAME }}
                  SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
                  SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
                  SF_BOARD_ID: ${{ secrets.SF_BOARD_ID }}
              run: npx playwright test --project=${{ matrix.device }}

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.device }}
                  path: playwright-report/
                  retention-days: 30
