name: E2E Tests

on:
    pull_request:
        branches: [main]
        paths:
            - 'e2e/**'
            - 'force-app/**'
            - '.github/workflows/e2e-*.yml'
            - '.github/actions/setup-e2e-org/**'
            - 'playwright.config.ts'
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: false

concurrency:
    group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    board-core:
        name: Board Core
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: board-core
            specs: 'kanban-board.spec.ts board-filters.spec.ts card-panel.spec.ts board-toolbar.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    backlog-sprint:
        name: Backlog & Sprint
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: backlog-sprint
            specs: 'backlog-view.spec.ts sprint-management.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    analytics:
        name: Analytics
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: analytics
            specs: 'analytics.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    unhappy-paths:
        name: Unhappy Paths
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: unhappy-paths
            specs: 'unhappy-paths.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    card-features:
        name: Card Features
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: card-features
            specs: 'card-comments.spec.ts card-files.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    epics:
        name: Epics
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: epics
            specs: 'epic-management.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    undo-redo:
        name: Undo/Redo
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: undo-redo
            specs: 'undo-redo.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    admin:
        name: Admin
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: admin
            specs: 'admin-management.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    column-mgmt:
        name: Column Management
        uses: ./.github/workflows/e2e-suite.yml
        secrets: inherit
        with:
            suite-name: column-mgmt
            specs: 'column-management.spec.ts'
            create-retro-data: false
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    multi-user:
        name: Multi-User Sync
        uses: ./.github/workflows/e2e-multi-user.yml
        secrets: inherit
        with:
            suite-name: multi-user
            specs: 'card-sync.spec.ts drag-drop-sync.spec.ts'
            persistent: true
            cache-key: ${{ github.head_ref || github.ref_name }}

    collect-results:
        name: Collect Results
        runs-on: ubuntu-latest
        needs:
            - board-core
            - backlog-sprint
            - analytics
            - unhappy-paths
            - card-features
            - epics
            - undo-redo
            - admin
            - column-mgmt
            - multi-user
        if: always()
        timeout-minutes: 5

        steps:
            - name: Download all suite outputs
              uses: actions/download-artifact@v4
              with:
                  pattern: e2e-output-*
                  path: suite-outputs

            - name: Post results to PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const suites = [
                        'board-core', 'backlog-sprint', 'analytics',
                        'unhappy-paths', 'card-features', 'epics',
                        'undo-redo', 'admin', 'column-mgmt', 'multi-user'
                      ];

                      // Single source for the comment title, also used as the
                      // update-in-place marker below — keep them identical.
                      const marker = 'E2E Tests (10 feature suites)';

                      let totalPassed = 0, totalFailed = 0, totalSkipped = 0, totalFlaky = 0;
                      let allPassed = true;
                      let body = '';

                      for (const suite of suites) {
                        const file = path.join('suite-outputs', `e2e-output-${suite}`, 'playwright-output.txt');
                        if (fs.existsSync(file)) {
                          const output = fs.readFileSync(file, 'utf8');
                          const tail = output.split('\n').slice(-50).join('\n');

                          const passedM = output.match(/(\d+) passed/);
                          const failedM = output.match(/(\d+) failed/);
                          const skippedM = output.match(/(\d+) skipped/);
                          const flakyM = output.match(/(\d+) flaky/);

                          const p = passedM ? parseInt(passedM[1]) : 0;
                          const f = failedM ? parseInt(failedM[1]) : 0;
                          const s = skippedM ? parseInt(skippedM[1]) : 0;
                          const fl = flakyM ? parseInt(flakyM[1]) : 0;

                          totalPassed += p; totalFailed += f;
                          totalSkipped += s; totalFlaky += fl;
                          if (f > 0) allPassed = false;

                          const icon = f > 0 ? 'FAIL' : 'PASS';
                          body += `### [${icon}] ${suite} -- ${p} passed, ${f} failed, ${s} skipped\n`;
                          body += `<details><summary>Output</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n\n`;
                        } else {
                          body += `### [SKIP] ${suite} -- No output\n\n`;
                          allPassed = false;
                        }
                      }

                      const status = allPassed ? 'PASS' : 'FAIL';
                      const summary = `**${totalPassed} passed** | **${totalFailed} failed** | **${totalSkipped} skipped** | **${totalFlaky} flaky**`;
                      const comment = `### [${status}] ${marker}\n\n${summary}\n\n${body}`;

                      const maxLen = 65000;
                      const truncated = comment.length > maxLen
                        ? comment.slice(0, maxLen) + '\n\n...truncated...'
                        : comment;

                      // Update existing comment or create new one
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });
                      const existing = comments.find(c => c.body && c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body: truncated,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: truncated,
                        });
                      }

            - name: Post Workflow Summary
              if: always()
              run: |
                  echo "## E2E Test Results -- 10 Feature Suites" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  for suite in board-core backlog-sprint analytics unhappy-paths card-features epics undo-redo admin column-mgmt multi-user; do
                    FILE="suite-outputs/e2e-output-${suite}/playwright-output.txt"
                    if [ -f "$FILE" ]; then
                      SUMMARY=$(tail -3 "$FILE" | head -1)
                      echo "### ${suite}: ${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
                    else
                      echo "### ${suite}: No output" >> "$GITHUB_STEP_SUMMARY"
                    fi
                  done

            - name: Fail if any suite failed
              if: |
                  needs.board-core.result == 'failure' ||
                  needs.backlog-sprint.result == 'failure' ||
                  needs.analytics.result == 'failure' ||
                  needs.unhappy-paths.result == 'failure' ||
                  needs.card-features.result == 'failure' ||
                  needs.epics.result == 'failure' ||
                  needs.undo-redo.result == 'failure' ||
                  needs.admin.result == 'failure' ||
                  needs.column-mgmt.result == 'failure' ||
                  needs.multi-user.result == 'failure'
              run: exit 1
