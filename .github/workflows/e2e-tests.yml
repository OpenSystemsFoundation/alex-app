name: E2E Tests (Playwright)

on:
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: false

jobs:
    e2e:
        name: E2E (${{ matrix.browser }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.branch || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Playwright
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file config/project-scratch-def.json \
                    --alias e2e-test \
                    --duration-days 1 \
                    --wait 10

            - name: Deploy Source
              run: sf project deploy start --target-org e2e-test --ignore-conflicts

            - name: Assign Permission Sets
              run: sf org assign permset --name Alex_Admin --target-org e2e-test

            - name: Create Sample Data
              run: |
                  sf apex run --file scripts/apex/CreateFilledKanbanBoard.apex --target-org e2e-test

            - name: Get Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org e2e-test --json 2>/dev/null | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      const j=JSON.parse(d);
                      console.log(j.result.url);
                    });
                  ")
                  echo "url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

            - name: Run Playwright Tests
              env:
                  SCRATCH_ORG_URL: ${{ steps.login.outputs.url }}
              run: npx playwright test --project=${{ matrix.browser }}

            - name: Upload Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: playwright-report/
                  retention-days: 14

            - name: Upload Traces
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces-${{ matrix.browser }}
                  path: test-results/
                  retention-days: 7

            - name: Delete Scratch Org
              if: always()
              run: sf org delete scratch --target-org e2e-test --no-prompt || true
