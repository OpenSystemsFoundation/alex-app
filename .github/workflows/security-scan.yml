name: Security Scan

on:
    pull_request:
        branches: [main]

jobs:
    code-analyzer:
        name: Salesforce Code Analyzer
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Code Analyzer v5
              run: sf plugins install @salesforce/plugin-code-analyzer

            - name: Run Code Analyzer
              run: |
                  mkdir -p scan-results
                  sf code-analyzer run \
                    --workspace "force-app" \
                    --output-file scan-results/code-analyzer-results.json \
                    --severity-threshold 2 || true

            - name: Upload Code Analyzer Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: code-analyzer-report
                  path: scan-results/
                  retention-days: 30

    js-vulnerability-scan:
        name: JS Vulnerability Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit npm dependencies
              run: npm audit --omit=dev || true
