# .github/workflows/scratch-org.yml
name: Scratch Org Test Drive

on:
    workflow_dispatch:
        inputs:
            duration:
                description: 'Scratch org duration in days (1-30)'
                type: number
                default: 7
            scratch_def:
                description: 'Scratch org definition file'
                type: choice
                default: 'config/project-scratch-def.json'
                options:
                    - config/project-scratch-def.json
                    - config/community-scratch-def.json
                    - config/preview-project-scratch-def.json
            skip_tests:
                description: 'Skip Apex tests after deploy'
                type: boolean
                default: false
    # Also allow triggering from PR comments with /scratch-org
    issue_comment:
        types: [created]

jobs:
    create-scratch:
        name: Create & Deploy Scratch Org
        runs-on: ubuntu-latest
        # Run on workflow_dispatch always, or on issue_comment only if it's a PR comment with /scratch-org
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request &&
             contains(github.event.comment.body, '/scratch-org'))

        steps:
            - name: Get PR branch (for issue_comment trigger)
              if: github.event_name == 'issue_comment'
              id: pr_branch
              uses: actions/github-script@v7
              with:
                  script: |
                      const pr = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number
                      });
                      core.setOutput('ref', pr.data.head.ref);
                      core.setOutput('pr_number', context.issue.number);

            - name: React to comment
              if: github.event_name == 'issue_comment'
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.reactions.createForIssueComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: context.payload.comment.id,
                        content: 'rocket'
                      });

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.pr_branch.outputs.ref || github.ref }}

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Authenticate DevHub
              run: |
                  echo "${{ secrets.SFDX_AUTH_URL }}" > sfdx_auth.txt
                  sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --alias devhub --set-default-dev-hub
                  rm sfdx_auth.txt

            - name: Determine scratch org config
              id: config
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "def_file=${{ inputs.scratch_def }}" >> "$GITHUB_OUTPUT"
                    echo "duration=${{ inputs.duration }}" >> "$GITHUB_OUTPUT"
                    echo "skip_tests=${{ inputs.skip_tests }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "def_file=config/project-scratch-def.json" >> "$GITHUB_OUTPUT"
                    echo "duration=7" >> "$GITHUB_OUTPUT"
                    echo "skip_tests=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create Scratch Org
              run: |
                  sf org create scratch \
                    --definition-file ${{ steps.config.outputs.def_file }} \
                    --alias test-drive \
                    --duration-days ${{ steps.config.outputs.duration }} \
                    --wait 15

            - name: Deploy Source (base package only)
              run: sf project deploy start --source-dir force-app --target-org test-drive --ignore-conflicts

            - name: Assign Permission Set
              run: sf org assign permset --name Alex_Admin --target-org test-drive

            - name: Import Sample Data
              run: |
                  # Create a sample board with columns so the user has something to see
                  sf apex run --target-org test-drive -f /dev/stdin <<'APEX' || true
                  OpenSF__Board__c board = new OpenSF__Board__c(
                      OpenSF__Active__c = true,
                      OpenSF__Status__c = 'Active',
                      OpenSF__Type__c = 'Sprint',
                      OpenSF__Description__c = 'Sample board created by CI/CD'
                  );
                  insert board;

                  List<OpenSF__Column__c> cols = new List<OpenSF__Column__c>();
                  String[] headers = new String[]{'To Do', 'In Progress', 'In Review', 'Done'};
                  String[] positions = new String[]{'a', 'b', 'c', 'd'};
                  String[] colors = new String[]{'#e0e5ee', '#fff3cd', '#cce5ff', '#d4edda'};
                  String[] categories = new String[]{'To Do', 'In Progress', 'In Review', 'Done'};
                  for (Integer i = 0; i < headers.size(); i++) {
                      cols.add(new OpenSF__Column__c(
                          OpenSF__Board__c = board.Id,
                          OpenSF__ColumnHeader__c = headers[i],
                          OpenSF__LexoRankPosition__c = positions[i],
                          OpenSF__Color__c = colors[i],
                          OpenSF__Category__c = categories[i]
                      ));
                  }
                  insert cols;

                  // Create a sample retrospective
                  OpenSF__Retrospective__c retro = new OpenSF__Retrospective__c(
                      OpenSF__Status__c = 'Active',
                      OpenSF__Template__c = 'Start_Stop_Continue',
                      OpenSF__MaxVotesPerUser__c = 5,
                      OpenSF__Board__c = board.Id
                  );
                  insert retro;

                  System.debug('Sample data created: Board=' + board.Id + ', Retro=' + retro.Id);
                  APEX
                  echo "Sample data import complete"

            - name: Run Apex Tests
              if: steps.config.outputs.skip_tests != 'true'
              run: |
                  sf apex run test \
                    --target-org test-drive \
                    --code-coverage \
                    --result-format human \
                    --wait 15 || true

            - name: Generate Login URL
              id: login
              run: |
                  LOGIN_URL=$(sf org open --target-org test-drive --url-only 2>&1)
                  echo "login_url=$LOGIN_URL" >> "$GITHUB_OUTPUT"

                  # Also get the org info for the summary
                  ORG_INFO=$(sf org display --target-org test-drive --json 2>&1 || true)
                  USERNAME=$(echo "$ORG_INFO" | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      try{const j=JSON.parse(d);console.log(j.result.username||'unknown')}
                      catch(e){console.log('unknown')}
                    });
                  ")
                  INSTANCE=$(echo "$ORG_INFO" | node -e "
                    let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                      try{const j=JSON.parse(d);console.log(j.result.instanceUrl||'unknown')}
                      catch(e){console.log('unknown')}
                    });
                  ")
                  echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
                  echo "instance_url=$INSTANCE" >> "$GITHUB_OUTPUT"

                  # Calculate expiry date
                  EXPIRY=$(date -d "+${{ steps.config.outputs.duration }} days" '+%Y-%m-%d' 2>/dev/null || date -v+${{ steps.config.outputs.duration }}d '+%Y-%m-%d')
                  echo "expiry=$EXPIRY" >> "$GITHUB_OUTPUT"

            - name: Post Job Summary
              run: |
                  BRANCH="${{ steps.pr_branch.outputs.ref || github.ref_name }}"
                  cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
                  ## Scratch Org Ready

                  | | |
                  |---|---|
                  | **Branch** | \`$BRANCH\` |
                  | **Username** | \`${{ steps.login.outputs.username }}\` |
                  | **Instance** | ${{ steps.login.outputs.instance_url }} |
                  | **Expires** | ${{ steps.login.outputs.expiry }} (${{ steps.config.outputs.duration }} days) |
                  | **Definition** | \`${{ steps.config.outputs.def_file }}\` |

                  ### Login Link

                  **[Click here to open the scratch org](${{ steps.login.outputs.login_url }})**

                  > This is a one-time use frontdoor link. After logging in, bookmark your org.
                  > To generate a new login link, run: \`sf org open --target-org <username>\`

                  ### What's deployed
                  - Full Alex source (kanban board, sprints, backlog, retrospectives)
                  - \`Alex_Admin\` permission set assigned
                  - Sample board with 4 columns (To Do, In Progress, In Review, Done)
                  - Sample retrospective (Start/Stop/Continue template)
                  SUMMARY

            - name: Comment on PR with login link
              if: github.event_name == 'issue_comment'
              uses: actions/github-script@v7
              with:
                  script: |
                      const loginUrl = '${{ steps.login.outputs.login_url }}';
                      const username = '${{ steps.login.outputs.username }}';
                      const expiry = '${{ steps.login.outputs.expiry }}';
                      const branch = '${{ steps.pr_branch.outputs.ref }}';

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body: `## Scratch Org Ready

                      | | |
                      |---|---|
                      | **Branch** | \`${branch}\` |
                      | **Username** | \`${username}\` |
                      | **Expires** | ${expiry} |

                      **[Click here to open the scratch org](${loginUrl})**

                      > One-time use frontdoor link. Bookmark after logging in.
                      > Sample board and retrospective pre-loaded.`
                      });
