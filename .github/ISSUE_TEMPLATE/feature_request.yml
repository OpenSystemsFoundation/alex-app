name: Feature request
description: Suggest an idea or improvement for Alex
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What are you trying to do, and what gets in the way today?
          placeholder: As a team lead, I want to ... because ...
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: How should it work? Mockups or examples from other tools are welcome.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Workarounds you use today, or other approaches you thought about.

    - type: checkboxes
      id: contribute
      attributes:
          label: Contribution
          options:
              - label: I'd like to help build this
