<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">C-K-R Theory → Koopman-QDMD Pipeline</text>

  <!-- R-space box -->
  <rect x="50" y="70" width="200" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">R-Space (Reality)</text>
  <text x="150" y="125" text-anchor="middle" font-size="12" fill="#78350f">Git history snapshots</text>
  <text x="150" y="145" text-anchor="middle" font-size="12" fill="#78350f">CI/CD observations</text>
  <text x="150" y="165" text-anchor="middle" font-size="12" fill="#78350f">Test results</text>

  <!-- K-space box -->
  <rect x="300" y="70" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">K-Space (Knowledge)</text>
  <text x="400" y="125" text-anchor="middle" font-size="12" fill="#1e3a8a">Koopman operator K</text>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="#1e3a8a">Eigenvalues λ_i</text>
  <text x="400" y="165" text-anchor="middle" font-size="12" fill="#1e3a8a">Eigenmodes φ_i</text>

  <!-- C-space box -->
  <rect x="550" y="70" width="200" height="120" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="650" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">C-Space (Concepts)</text>
  <text x="650" y="125" text-anchor="middle" font-size="12" fill="#831843">Abductive projection</text>
  <text x="650" y="145" text-anchor="middle" font-size="12" fill="#831843">Missing feature X</text>
  <text x="650" y="165" text-anchor="middle" font-size="12" fill="#831843">Cohen forcing</text>

  <!-- R→K arrow -->
  <line x1="250" y1="115" x2="295" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="108" text-anchor="middle" font-size="11" fill="#475569">DMD</text>

  <!-- K→C arrow -->
  <line x1="500" y1="115" x2="545" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="108" text-anchor="middle" font-size="11" fill="#475569">QPE</text>

  <!-- C→R arrow (bottom, curved) -->
  <path d="M 650 195 L 650 250 L 150 250 L 150 195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="270" text-anchor="middle" font-size="12" fill="#475569">Build → Test → Observe (new snapshot)</text>

  <!-- Quantum box -->
  <rect x="250" y="310" width="300" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Quantum Hardware</text>
  <text x="400" y="365" text-anchor="middle" font-size="13" fill="#14532d">IBM Kingston (Heron R2)</text>

  <text x="310" y="395" font-size="12" fill="#14532d">• QPE: eigenvalue extraction</text>
  <text x="310" y="415" font-size="12" fill="#14532d">• QDMD: exp. speedup at N≥20</text>
  <text x="310" y="435" font-size="12" fill="#14532d">• VQK: learned Koopman unitary</text>

  <!-- K→Quantum arrow -->
  <line x1="400" y1="195" x2="400" y2="305" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="420" y="255" font-size="11" fill="#2563eb">U_K = exp(iA_H·s)</text>
</svg>
