<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif">
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">IBM Kingston QPE — Eigenphase Distribution (8192 shots)</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#64748b">Job: d70o5jc69uic73ckjdn0 | Heron R2, 156 qubits | Depth 2117, 632 CZ gates</text>

  <!-- Axes -->
  <line x1="70" y1="350" x2="760" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="350" x2="70" y2="65" stroke="#334155" stroke-width="2"/>
  <text x="415" y="395" text-anchor="middle" font-size="14" fill="#475569">Measured Phase (θ)</text>
  <text x="25" y="210" text-anchor="middle" font-size="14" fill="#475569" transform="rotate(-90, 25, 210)">Probability</text>

  <!-- Y-axis ticks -->
  <text x="62" y="355" text-anchor="end" font-size="11" fill="#64748b">0%</text>
  <line x1="65" y1="278" x2="760" y2="278" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="283" text-anchor="end" font-size="11" fill="#64748b">1%</text>
  <line x1="65" y1="206" x2="760" y2="206" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="211" text-anchor="end" font-size="11" fill="#64748b">2%</text>
  <line x1="65" y1="134" x2="760" y2="134" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="139" text-anchor="end" font-size="11" fill="#64748b">3%</text>
  <line x1="65" y1="62" x2="760" y2="62" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="67" text-anchor="end" font-size="11" fill="#64748b">4%</text>

  <!-- Uniform baseline -->
  <line x1="70" y1="238" x2="760" y2="238" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="765" y="235" font-size="10" fill="#ef4444">uniform (1/64 = 1.56%)</text>

  <!-- Bars — top 15 phases, x range 70-760, phase 0.0-1.0 -->
  <!-- Scale: phase p → x = 70 + p*690, prob → height = prob*7200 from baseline 350 -->

  <!-- phase=0.0000 prob=2.37% → x=70, h=170.6 → y=179 -->
  <rect x="66" y="179" width="9" height="171" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.3125 prob=2.32% → x=286, h=167 → y=183 -->
  <rect x="282" y="183" width="9" height="167" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.3594 prob=2.06% → x=318, h=148 → y=202 -->
  <rect x="314" y="202" width="9" height="148" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.3750 prob=2.20% → x=329, h=158 → y=192 -->
  <rect x="325" y="192" width="9" height="158" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.4375 prob=3.50% → x=372, h=252 → y=98 — TOP -->
  <rect x="368" y="98" width="9" height="252" rx="2" fill="#2563eb" opacity="0.9"/>
  <text x="372" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">3.50%</text>

  <!-- phase=0.5000 prob=3.36% → x=415, h=242 → y=108 -->
  <rect x="411" y="108" width="9" height="242" rx="2" fill="#2563eb" opacity="0.9"/>
  <text x="415" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">3.36%</text>

  <!-- phase=0.5625 prob=2.81% → x=458, h=202 → y=148 -->
  <rect x="454" y="148" width="9" height="202" rx="2" fill="#2563eb" opacity="0.8"/>

  <!-- phase=0.6094 prob=2.60% → x=490, h=187 → y=163 -->
  <rect x="486" y="163" width="9" height="187" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.6875 prob=2.60% → x=544, h=187 → y=163 -->
  <rect x="540" y="163" width="9" height="187" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.7344 prob=2.06% → x=577, h=148 → y=202 -->
  <rect x="573" y="202" width="9" height="148" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.7500 prob=3.15% → x=588, h=227 → y=123 -->
  <rect x="584" y="123" width="9" height="227" rx="2" fill="#2563eb" opacity="0.9"/>
  <text x="588" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">3.15%</text>

  <!-- phase=0.8125 prob=2.69% → x=631, h=194 → y=156 -->
  <rect x="627" y="156" width="9" height="194" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.8594 prob=2.25% → x=663, h=162 → y=188 -->
  <rect x="659" y="188" width="9" height="162" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.875 prob=2.10% → x=674, h=151 → y=199 -->
  <rect x="670" y="199" width="9" height="151" rx="2" fill="#94a3b8" opacity="0.7"/>

  <!-- phase=0.9375 prob=2.84% → x=717, h=205 → y=145 -->
  <rect x="713" y="145" width="9" height="205" rx="2" fill="#2563eb" opacity="0.8"/>
  <text x="717" y="137" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">2.84%</text>

  <!-- X-axis labels -->
  <text x="70" y="368" text-anchor="middle" font-size="10" fill="#64748b">0.0</text>
  <text x="243" y="368" text-anchor="middle" font-size="10" fill="#64748b">0.25</text>
  <text x="415" y="368" text-anchor="middle" font-size="10" fill="#64748b">0.50</text>
  <text x="588" y="368" text-anchor="middle" font-size="10" fill="#64748b">0.75</text>
  <text x="760" y="368" text-anchor="middle" font-size="10" fill="#64748b">1.0</text>

  <!-- Legend -->
  <rect x="85" y="70" width="12" height="12" rx="2" fill="#2563eb" opacity="0.9"/>
  <text x="103" y="81" font-size="11" fill="#334155">Peaks above 2.8% (eigenvalue signal)</text>
  <rect x="85" y="88" width="12" height="12" rx="2" fill="#94a3b8" opacity="0.7"/>
  <text x="103" y="99" font-size="11" fill="#334155">Secondary peaks</text>

  <!-- H5 result box -->
  <rect x="520" y="65" width="230" height="55" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">H5: SUPPORTED</text>
  <text x="635" y="102" text-anchor="middle" font-size="11" fill="#14532d">Mean phase error: 0.091 &lt; 0.10</text>
  <text x="635" y="115" text-anchor="middle" font-size="11" fill="#14532d">Max phase error: 0.138</text>
</svg>
